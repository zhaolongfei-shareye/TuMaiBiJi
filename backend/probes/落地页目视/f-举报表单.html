<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<title>举报这篇</title>
<style>body { margin: 0; padding: 40px 22px; font: 16px/1.7 -apple-system, "PingFang SC",

select, textarea { width: 100%; font: inherit; margin-top: 4px }

<body>
<h1>举报这篇</h1>
<p class="hint">京都散步：避开人潮的四条小众路线，附带清晨时段与咖啡店营业时间</p>
<form method="post" action="/n/visual-long/report">

<textarea name="detail" maxlength="500" rows="4"></textarea></label>
<button type="submit">提交</button>
</form>
<p><a href="/n/visual-long/report?lang=en">English</a>
