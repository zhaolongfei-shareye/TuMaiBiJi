# 公开落地页 /n/<token> 与 AASA —— 贴进 nginx 的那两段
#
# 目标文件：/etc/nginx/sites-enabled/agentsbin-cn（服务器上是 root 拥有，改要 sudo）
# 贴进哪儿：**第一个** server 块——`server_name agentsbin.cn www.agentsbin.cn;` 那个（HTTPS 443）。
#          不要贴到 api.agentsbin.cn 那个块里：Universal Link 认的是"域名＋路径"，
#          卡片上印的、微信里传的都是 https://agentsbin.cn/n/<token>，换子域就不匹配。
#
# 现网那个块原本只有两条 location（核对时间 2026-10-08 22:05，命令 `sudo cat` 那个文件）：
#     root /var/www/agentsbin-cn;
#     location /        { try_files $uri $uri/ /index.html; }   ← 未知路径一律回官网首页，而且是 200
#     location /assets/ { expires 7d; ... }
#   所以这两段是**纯新增**，不动那两条；`root` 也在 server 级已经给了，下面两段都继承它。
#
# 为什么这两段必须都在：
#   1) `/n/` 这条把公开页从"官网静态站"里分出来转给后端 8000。不加它，
#      `/n/<token>` 会命中 `location /` 的 try_files，被回成官网首页那张 HTML——
#      状态码还是 200，扫码的人看到的是水印站，落地页等于没上线。
#      nginx 的前缀匹配是"最长者胜"，`/n/` 比 `/` 长，所以加上就生效，不必改 `/` 那条。
#   2) AASA 这条是为了**内容类型**。文件名 `apple-app-site-association` 没有扩展名，
#      现网 `/etc/nginx/mime.types` 里 `grep -c association` = **0**（2026-10-08 核对），
#      而 `/etc/nginx/nginx.conf` 第 26 行写的是 `default_type application/octet-stream;`
#      —— 所以不指 default_type 的话它会以 octet-stream 发出去。Apple 要求 application/json。
#      `location =` 是精确匹配，优先级最高，所以它只接管这一条路径，官网其余文件仍走原来的 try_files。
#
# 改完必须先 `sudo nginx -t` 再 reload（-t 不过就别 reload，现网会保持旧配置继续跑）。

# ---- ① 公开落地页：转给后端 ----
location /n/ {
    proxy_pass http://127.0.0.1:8000;
    # 不带 URI 的 proxy_pass（上面这行结尾没有斜杠）会把 /n/<token> 原样送进去，
    # 后端那条路由注册的路径就是 /n/{token}，两边正好对上。
    # 写成 proxy_pass http://127.0.0.1:8000/; 反而会把 /n/ 这一段截掉，变 404。

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 这两条是举报口那条 6/小时限流的命根子：uvicorn 已经带 --proxy-headers
    # --forwarded-allow-ips=127.0.0.1（2026-10-08 在现网 systemctl cat wtsj-api 核对过），
    # 但只有 nginx 真的把 X-Forwarded-For 传上来，get_remote_address() 才拿得到访客真实地址。
    # 少这一行，所有访客会被算成同一个 127.0.0.1 —— 一个人刷满 6 次就把全站举报口堵死。
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# ---- ② AASA：内容类型必须是 application/json ----
location = /.well-known/apple-app-site-association {
    default_type application/json;
    # 文件本身放在 /var/www/agentsbin-cn/.well-known/ 下（继承上面的 root）。
    # 不许重定向、不许要鉴权、体积上限 128KB —— 这三条是 Apple 侧的硬要求。
    # 也**不要**给它加 expires：AASA 换内容后要让设备尽快重新取，缓存越短越好。
}
