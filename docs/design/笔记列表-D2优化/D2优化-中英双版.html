   他 09-28 口径：「笔记列表，在之前 D2 定稿版基础上优化」。

/* ---------- 颜色数学：这稿里所有对比度和派生色都由这里算，不手填 ---------- */
const rgb = (h) => { const s = h.replace('#',''); const n = parseInt(s.slice(0,6),16); return [(n>>16)&255,(n>>8)&255,n&255] }
const hex = (a) => '#' + a.map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')
const toHsl = (h) => {
  let [r,g,b] = rgb(h).map(v => v/255)
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn, l = (mx+mn)/2
  let hh = 0
  if (d) { hh = mx===r ? ((g-b)/d + (g<b?6:0)) : mx===g ? (b-r)/d+2 : (r-g)/d+4; hh *= 60 }
  const s = d ? d/(1 - Math.abs(2*l-1)) : 0
  return [hh, s*100, l*100]
}
const fromHsl = (H,S,L) => {
  const s = S/100, l = L/100, c = (1-Math.abs(2*l-1))*s, x = c*(1-Math.abs(((H/60)%2)-1)), m = l-c/2
  const t = H<60?[c,x,0]:H<120?[x,c,0]:H<180?[0,c,x]:H<240?[0,x,c]:H<300?[x,0,c]:[c,0,x]
  return hex(t.map(v => (v+m)*255))
}
const lum = (h) => { const f = (v) => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4) }
  const [r,g,b] = rgb(h); return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b) }
const cr = (a,b) => { const x = lum(a), y = lum(b), [hi,lo] = x>y ? [x,y] : [y,x]; return (hi+0.05)/(lo+0.05) }
const over = (fg, bg, a) => hex(rgb(fg).map((v,i) => v*a + rgb(bg)[i]*(1-a)))   // 半透明白叠在页面底上
const r2 = (n) => Math.round(n*100)/100

/* ⑥ 派生规则（规划 §1.2 那一条）：色相原样、饱和度夹进 [30,45]、明度按深浅定档 */
const skin = (page, dark) => { const [H,S] = toHsl(page); return fromHsl(H, Math.min(45,Math.max(30,S)), dark?30:20.5) }

/* 八套壁纸：page 与 dark 全部从 utils/palette.js 的 THEMES 抄来（改一边必须改另一边） */

const head = (l) => `<div class="head"><div class="h1 ${l===L.en?'en':''}">${l.head}</div><div class="stats">${l.stats}</div></div>`
/* 只有「未分类」是字典串（i18n.js:377 noCategory），其余五支是用户自己起的名字，英文界面下也还是原样 */
const catName = (i, l) => i === 5 ? l.uncat : CATS[i][0]
const chips = (l) => `<div class="chips"><div class="chip on">${l.all}</div>${[...new Set(l.rows.map(r=>r.c))].map(i=>`<div class="chip">${catName(i,l)}</div>`).join('')}</div>`
const search = (l, typing) => `<div class="sc"><div class="line">
    <div class="${typing?'val':'ph-txt'}">${typing?'咖啡':l.ph}</div>${typing?'<div class="x">✕</div>':''}
    <div class="go">${l.go}</div><div class="rule"></div></div></div>`
const row = (l, r) => {
  const [,dotL,txtL,dotD,txtD] = CATS[r.c]
  const skinVars = `--cat-dot-l:${dotL};--cat-txt-l:${txtL};--cat-dot-d:${dotD||'transparent'};--cat-txt-d:${txtD}`
  return `<div class="row">
    <div class="ti">${r.pin?`<span class="pin">${l.pin}</span>`:''}${r.t}</div>
    ${r.s?`<div class="sm">${r.s}</div>`:''}
    <div class="mt"><span class="lb${r.c===5?' uncat':''}" style="${skinVars}"><i></i>${catName(r.c,l)}</span><span class="sep">·</span><span class="src">${r.src}</span>
      ${r.tg?`<span class="sep">·</span><span class="tg">${r.tg}</span>`:''}
      <span class="dt">${l.date}</span><span class="cv">›</span></div></div>`
}
const list = (l, n) => l.rows.slice(0,n).map(r=>row(l,r)).join('')

const unit = (step, h3, p, body, tall) => `<div class="unit">
  <div class="cap"><span class="step">${step}</span><h3>${h3}</h3><p>${p}</p></div>
  <div class="ph${tall?' doc':''}">${body}</div></div>`

/* 一屏 = 外框（状态栏 + 导航条）+ 页面视口 + 底栏；壁纸决定 --page 和 --skin */
const screen = (step, h3, p, l, inner, wall, cls) => {
  const [name, page, dark] = wall
  const body = `<div class="sb"><span>9:41</span><span class="right"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="bat"></span></span></div>
    <div class="nb"><span class="t">${l.nav}</span><span class="capsule"><span class="d"><i></i><i></i><i></i></span><span class="v"></span><span class="c"></span></span></div>
    <div class="stage${cls?' '+cls:''}">${inner}</div>
    <div class="tabbar">
      <div class="tb"><div class="tbi i-new"></div>${l===L.zh?'新建':'New'}<div class="u" style="opacity:0"></div></div>
      <div class="tb on"><div class="tbi i-note"></div>${l===L.zh?'笔记':'Notes'}<div class="u"></div></div>
      <div class="tb"><div class="tbi i-me"></div>${l===L.zh?'我的':'Mine'}<div class="u" style="opacity:0"></div></div>
    </div>`
  return unit(step, h3, p, `<div class="ph${dark?' dark':''}" style="--page:${page};--skin:${skin(page,dark)}">${body}</div>`)
}

/* ---------- 标注屏：每一张表都由上面那些函数现算 ---------- */
const skinRows = WALLS.map(([n,page,dark]) => {
  const s = skin(page,dark), idle = dark ? 'rgba(242,239,233,.68)' : 'rgba(242,239,233,.62)'
  const idleHex = over('#F2EFE9', s, dark?0.68:0.62)
  return `<tr><td><i style="background:${s}"></i><b>${n}</b></td><td><code>${page}</code></td>
    <td><code>${s}</code> ${s.toLowerCase()===DOC_SKIN[n].toLowerCase()?'<span class="ok">与 §1.2 同值</span>':'<span class="no">与 §1.2 不符（'+DOC_SKIN[n]+'）</span>'}</td>
    <td>${r2(cr('#F2EFE9',s))}</td><td>${r2(cr(idleHex,s))}</td><td>${r2(cr(s,page))}</td></tr>`
}).join('')

const cardLight = '#FFFFFF', cardDark = over('#FFFFFF','#0C0C1D',0.05)
const catRows = CATS.map(([n,dotL,txtL,dotD,txtD]) => {
  const dl = dotL ? cr(dotL,cardLight) : cr('#23252C',cardLight)
  const dd = dotD ? cr(dotD,cardDark) : cr('#FFFFFF',cardDark)
  return `<tr><td><i style="background:${dotL||'transparent'};border-color:${dotL?'transparent':'rgba(35,37,44,.35)'}"></i><b>${n}</b></td>
    <td><code>${dotL||'实心墨黑'}</code> / <code>${txtL}</code></td><td>${r2(dl)}</td><td>${r2(cr(txtL,cardLight))}</td>
    <td><i style="background:${dotD||'transparent'};border-color:rgba(255,255,255,.42)"></i><code>${dotD||'空心环'}</code> / <code>${txtD}</code></td>
    <td>${r2(dd)}</td><td>${r2(cr(txtD,cardDark))}</td></tr>`
}).join('')

/* 一屏能放几条：从渲染结果里量，不是估的 */
function rowsPerScreen(){
  const stage = document.querySelector('.u1'), ph = stage.closest('.ph')
  const tab = ph.querySelector('.tabbar').getBoundingClientRect()
  const rows = [...ph.querySelectorAll('.row')]
  const h = rows.map(r => Math.round(r.getBoundingClientRect().height))
  const fit = rows.filter(r => r.getBoundingClientRect().bottom <= tab.top).length
  return { h, fit, first: rows[0].getBoundingClientRect().top - stage.getBoundingClientRect().top + 184 }
}

const DOC = `
  <div class="stage" style="padding-top:0">
    <div class="blk">
      <h4>这一稿相对 D2 定稿只动六处</h4>
      <p><b>① 分类点、分类名、标签这三段的关系修正。</b>现网左侧那块方块里写的字其实是<b>第一个标签</b>（<code>pages/index/index.js:146</code> 的 <code>blockName = firstTag || 分类名</code>），而块的颜色是按<b>分类 id</b> 取的（<code>blockSkinFor(categoryId)</code>）——颜色和文字对不上，一条笔记归在「产品」却写着「界面」。D2 撤掉方块之后，点色和它旁边那三个字都归分类，标签退回 meta 行最后那段。这条不是审美，是把一处错位改对。</p>
      <p><b>② meta 行那三个字的字色。</b>现网 <code>.row-foot</code> 吃 <code>--text-tertiary</code>（米白下 <code>#9A9EA6</code>），压白卡实测只有 <b>2.69</b>，而它是 21rpx 的小字、按 4.5 判。D2 之后这一行成了分类身份的一部分，不能还是灰不溜秋——来源和日期抬到 <code>--text-secondary</code>（<code>#5C6068</code>，压白卡 <b>6.79</b>），分类名吃两档定值（下表逐支量过）。</p>
      <p><b>③ 超长时谁被裁。</b>定稿那版把三段塞进一个 <code>overflow:hidden</code> 的容器，英文长标签一挤，<b>分类名会被整段裁掉</b>——而"颜色 + 文字同时出现"是锚点 3 的硬约束。这一稿把分类那段设成 <code>flex:none</code>，被裁的只有标签段（第 ① 屏第四条那行挂了四个标签，就是留给这一刀撞的）。</p>
      <p><b>④ 撤掉稿子里那行"额度"。</b>定稿的页头右侧画了两行：三个数 + 一行额度。现网 <code>index.wxml:5</code> 只有一个 <code>statsText</code>，而且笔记已定为<b>不限量</b>，那行字本来就不该存在。这跟上一批那行"日期"是同一类错（效果图自己长出来的元素）。</p>
      <p><b>⑤ 空态、加载态、搜索中三屏补画。</b>之前所有稿子只画了"有数据"那一屏。第 ③④⑤ 屏补上：搜索中输入的字和占位符是两个色（62% 那档只用于占位符）；空态那行字要过 4.5；加载态没有内容可看，所以只有那枚转圈。</p>
      <p><b>⑥ 底栏与搜索条那块色改成函数现算。</b>规则还是规划 §1.2 那一条：页面底转 HSL，<b>色相原样保留</b>、饱和度夹进 [30%,45%]、明度浅档 20.5% / 深档 30%。这张稿子里那八支不是我抄的，是这个函数算出来的，并且逐个和 §1.2 表对了一遍（下表八行全绿才算过）。</p>
      <p><b>没动的：</b>圆角（<code>--r-card</code> 40 / <code>--r-pill</code> 999 / <code>--r-btn</code> 16 原样）、三个文字标签、选中态那条 26 短线、行卡结构（标题 / 摘要 / meta 三段）、摘要两行改一行的截法、置顶牌、胶囊。深色那两枚的卡片底（<code>rgba(255,255,255,.05)</code> 压页面底只有 <b>1.11</b>）也<b>不动</b>——那是阶段 2 外观系统的事，这次顺手改会把两批风险叠一起。</p>
    </div>

    <div class="blk">
      <h4>八支派生色（函数算的，和 §1.2 对表）</h4>
      <table><tr><th>壁纸</th><th>页面底</th><th>派生色 = 底栏 = 搜索条</th><th>纸白字</th><th>未选中字</th><th>压页面底</th></tr>${skinRows}</table>
      <p style="margin-top:14px">判据：纸白字 ≥7、未选中字 ≥4.5、这块面压页面底 ≥3。<b>深色那两枚（夜紫 / 深海）压页面底不到 3</b>，这条不粉饰：再抬到 3 那一整块就从"这套壁纸的深色"变成"一块亮蓝"，反而不像同一个主题，所以边界交给那一圈纸白 @22% 发丝边、可读交给字。现网那块 <code>#23252C</code> 压夜紫只有 <b>1.14</b>，比这版差得多。</p>
    </div>

    <div class="blk">
      <h4>分类两档（点色 / 文字色）压卡底实测</h4>
      <table><tr><th>分类</th><th>浅色档 点 / 字</th><th>点压白卡</th><th>字压白卡</th><th>深色档 点 / 字</th><th>点压深卡</th><th>字压深卡</th></tr>${catRows}</table>
      <p style="margin-top:14px">浅色卡底 <code>#FFFFFF</code>，深色卡底是 <code>rgba(255,255,255,.05)</code> 叠夜紫页面底算出来的 <code>${cardDark}</code>。那三个字是 21rpx 小字，<b>按 4.5:1 判：浅色档 4.97~15.30、深色档 7.09~10.75，两档六支全过</b>。那枚 14rpx 的点按图形对象判 3:1，<b>浅色档下 芥末黄 1.63、草绿 2.98 这两枚不过</b>——这一条我不改点色：点在这里不是唯一编码，紧挨着它的分类名已经过了 4.5，去掉颜色也不影响读出"这是哪一类"（1.4.1 要的是"只靠颜色才能理解"的那些信息）。深色档那六枚点 7.09~17.50 全过。未分类在浅色下是实心墨黑点（压白卡 15.30），在深色下改成<b>空心环</b>——"没归类"这件事本来就该长得不一样，硬给一块深色只会糊掉。</p>
    </div>

    <div class="blk">
      <h4>行卡尺寸与一屏几条（从这张渲染结果里量的）</h4>
      <table><tr><th></th><th>数值（rpx）</th></tr>
        <tr><td>行卡高（标题 + 摘要 + meta）</td><td id="rh"></td></tr>
        <tr><td>行间距</td><td>16（<code>--sp-2</code>，没动）</td></tr>
        <tr><td>第一行顶边</td><td id="ft"></td></tr>
        <tr><td>一屏放得下</td><td id="fp"></td></tr>
        <tr><td>卡片左右内缩 / 内边距</td><td>24 / 26（现网 <code>.row</code> 原值）</td></tr>
      </table>
      <p style="margin-top:14px">撤掉左侧那块 176 之后，正文从 468 宽变成 698 宽，<b>摘要基本不用再折第二行</b>——行高是"内容放得下"带来的，不是我调内边距调出来的。我试过把 <code>.row</code> 的 26 收到 24：每行只省 4rpx，一屏多不出半条，所以这稿<b>不改内边距</b>。</p>
    </div>

    <div class="warn">
      <h4>要你拍的三件事</h4>
      <p><b>一、meta 行字色抬档（②）要不要。</b>抬了以后 21rpx 那行字全部达标，代价是"淡"的味道少一点——现网那种灰是刻意压低的。</p>
      <p><b>二、未分类改空心环（深色下）认不认。</b>浅色下还是实心墨黑点，只有深色下换成环。</p>
      <p><b>三、落地范围。</b>这一版要一起改的有四处：列表页行卡、分类筛选胶囊、详情页那行分类身份、底栏与搜索条那块色（<code>custom-tab-bar/</code> 里七处写死的 <code>rgba(255,255,255,.42)</code> 改成吃 <code>currentColor</code>）。规矩是"同一个分类在全应用只有一张脸"，拆开做就会出现列表是新的、详情是旧的样子。<b>派生色必须是 <code>palette.js</code> 里那个函数，不许抄成一张八行表</b>（后端还会加壁纸）。</p>
    </div>
  </div>`

/* ---------- 装配：七屏 + 一张标注 ---------- */
const flow = document.getElementById('flow')
const RICE = WALLS[0], PURP = WALLS[4]
let html = ''
html += screen('① 中文 · 米白 首屏','D2 画法 + 这一稿六处修正','左侧 176 方块撤掉，分类退到 meta 行那枚 14rpx 点加三个字；底栏和搜索条同一块色，由壁纸派生。',
  L.zh, `${head(L.zh)}${search(L.zh)}${chips(L.zh)}${list(L.zh,6)}`, RICE, 'u1')
html += screen('② 中文 · 夜紫 首屏','深色那一档，同一条规则','卡片底仍是现网那层 5% 白（压页面底 1.11，这条留给阶段 2）；分类字吃深色档，未分类换成空心环。',
  L.zh, `${head(L.zh)}${search(L.zh)}${chips(L.zh)}${list(L.zh,6)}`, PURP)
html += screen('③ 中文 · 搜索中','输入的字和占位符是两个色','占位符那档 62% 只管"还没输入"；一旦有字就是纸白 100%，右边多一个 ✕。结果只剩两条。',
  L.zh, `${head(L.zh)}${search(L.zh,true)}${chips(L.zh)}${list(L.zh,2)}`, RICE)
html += screen('④ 中文 · 空态','之前每一版稿子都漏的一屏','一条笔记都没有时页面长这样。那行字吃 --text-secondary，压页面底实测见标注，要过 4.5。',
  L.zh, `${head(L.zh)}${search(L.zh)}${chips(L.zh)}<div class="empty">${L.zh.empty}</div>`, RICE)
html += screen('⑤ 中文 · 加载','首屏进来之那一瞬','没有内容可看，所以只有那枚转圈加一行字——不画骨架屏（现网没有，也不该顺手加）。',
  L.zh, `${head(L.zh)}${search(L.zh)}${chips(L.zh)}<div class="empty" style="padding:120px 0"><div class="spin"></div>${L.zh.loading}</div>`, RICE)
html += screen('⑥ English · 米白','Same rules, English strings','"Uncategorised" 13 个字符，是 meta 行最宽的一格——所以第 ③ 处那条裁切规则在英文下更要紧。',
  L.en, `${head(L.en)}${search(L.en)}${chips(L.en)}${list(L.en,6)}`, RICE)
html += screen('⑦ English · 夜紫','Dark tier','Category names and note content are user data, not dictionary strings — only 未分类 is ours.',
  L.en, `${head(L.en)}${search(L.en)}${chips(L.en)}${list(L.en,6)}`, PURP)
html += '<div class="brk"></div>'
html += unit('⑧ 标注','六处修正的出处、八支派生色对表、分类两档实测、还欠什么','表里每一个数都是这页 JS 现算的，不是我抄进稿子的。', DOC, true)
flow.innerHTML = html

/* 行卡尺寸与一屏几条：从渲染结果里量 */
const m = rowsPerScreen()
document.getElementById('rh').textContent = m.h.join(' / ')
document.getElementById('ft').textContent = Math.round(m.first)
document.getElementById('fp').textContent = m.fit + ' 条（底栏压住的那一行不计）'

</script>
