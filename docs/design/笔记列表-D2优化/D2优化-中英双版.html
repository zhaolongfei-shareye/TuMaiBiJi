<script>
/* ---------- 颜色数学：这稿里所有对比度和派生色都由这里算，不手填 ---------- */
const rgb = (h) => { const s = h.replace('#',''); const n = parseInt(s.slice(0,6),16); return [(n>>16)&255,(n>>8)&255,n&255] }
const hex = (a) => '#' + a.map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')
const toHsl = (h) => {
  let [r,g,b] = rgb(h).map(v => v/255)
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn, l = (mx+mn)/2
  let hh = 0
  if (d) { hh = mx===r ? ((g-b)/d + (g<b?6:0)) : mx===g ? (b-r)/d+2 : (r-g)/d+4; hh *= 60 }
  const s = d ? d/(1 - Math.abs(2*l-1)) : 0
  return [hh, s*100, l*100]
}
const fromHsl = (H,S,L) => {
  const s = S/100, l = L/100, c = (1-Math.abs(2*l-1))*s, x = c*(1-Math.abs(((H/60)%2)-1)), m = l-c/2
  const t = H<60?[c,x,0]:H<120?[x,c,0]:H<180?[0,c,x]:H<240?[0,x,c]:H<300?[x,0,c]:[c,0,x]
  return hex(t.map(v => (v+m)*255))
}
const lum = (h) => { const f = (v) => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4) }
  const [r,g,b] = rgb(h); return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b) }
const cr = (a,b) => { const x = lum(a), y = lum(b), [hi,lo] = x>y ? [x,y] : [y,x]; return (hi+0.05)/(lo+0.05) }
const over = (fg, bg, a) => hex(rgb(fg).map((v,i) => v*a + rgb(bg)[i]*(1-a)))   // 半透明白叠在页面底上
const r2 = (n) => Math.round(n*100)/100

/* ⑥ 派生规则（规划 §1.2 那一条）：色相原样、饱和度夹进 [30,45]、明度按深浅定档 */
const skin = (page, dark) => { const [H,S] = toHsl(page); return fromHsl(H, Math.min(45,Math.max(30,S)), dark?30:20.5) }

/* 八套壁纸：page 与 dark 全部从 utils/palette.js 的 THEMES 抄来（改一边必须改另一边） */
const WALLS = [
  ['米白','#F4F2EC',false], ['雾蓝','#EAEEFB',false], ['松绿','#E7F3EA',false], ['暮橙','#FDEEE6',false],
  ['夜紫','#0C0C1D',true], ['深海','#0D1B2A',true], ['象牙','#F2EFE9',false], ['天青','#E9EEEA',false],
]
/* 规划 §1.2 表里那八支（拿它对表，不是拿来直接用——真正的值由 skin() 现算） */
const DOC_SKIN = { '米白':'#443C25','雾蓝':'#1D284C','松绿':'#23462C','暮橙':'#4C2D1D',
  '夜紫':'#2D2D6C','深海':'#2A4B6F','象牙':'#443A25','天青':'#25442B' }

/* 分类两档：点色 + 文字色。浅色档 = 定稿里那六档；深色档同理。
   注意这是"分类身份"的两档定值（锚点 2），不是第五支彩色。 */
const CATS = [
  ['芥末黄','#F6C445','#856D30','#F6C445','#F6C445'],
  ['宝蓝','#3F52D6','#3F52D6','#7FA8FF','#7FA8FF'],
  ['橙','#E9723D','#A35432','#EF8C58','#EF8C58'],

/* 一屏能放几条：从渲染结果里量，不是估的 */
function rowsPerScreen(){
  const stage = document.querySelector('.u1'), ph = stage.closest('.ph')
  const tab = ph.querySelector('.tabbar').getBoundingClientRect()
  const rows = [...ph.querySelectorAll('.row')]
  const h = rows.map(r => Math.round(r.getBoundingClientRect().height))
  const fit = rows.filter(r => r.getBoundingClientRect().bottom <= tab.top).length
  return { h, fit, first: rows[0].getBoundingClientRect().top - stage.getBoundingClientRect().top + 184 }
}

    <p><b>一、这块面在铺图时不能用派生色——这条是量出来的，不是审美。</b>"底栏 = 搜索条 = 壁纸派生"那条规则的前提是这块面压在<b>页面底</b>上（规划 §1.2 判据写的就是"压页面底 ≥3"）。铺图之后它压的是照片，米白派生 <code>#443C25</code> 压照片最差那一格只有 <b>1.00~1.01</b>，边界等于没有。所以这一稿画成：<b>A 里搜索条和底栏都改纸白面 + 墨黑字</b>（就是首页那条录入条同一张脸），<b>C 里只有搜索条改纸白，底栏留派生色</b>——C 的底栏本来就在淡出段以下、压的是纯色页面底，那里派生色 9.78、换纸白反而掉到 1.03。同一张表左边两列就是这两组数。</p>
    <p><b>二、三个数（本周 / 本月 / 总数）在照片上照抄首页那档 78% 不够。</b>它是 24rpx 半粗，按 4.5 判，最差那一格 A <b>3.69</b> / C <b>3.47</b>。这一稿的处理是<b>抬到纸白 100%</b>（算出来 A 要 94%、C 要 100% 才过，所以直接给满），不给它加新元素。另一条路是保持 78% 但自己垫一层淡底（同胶囊那块 <code>rgba(18,20,26,.42)</code>，表里第三行量过：垫完 5.90 / 5.62 也过）——多一块面，少一分干净，我倾向前者。</p>
    <p><b>三、卡片跟不跟着翻。</b>现在画的是白卡压在暗照片上——最跳，也最好认（内容区一眼分得出来）。另一条路是卡片也翻成深色玻璃（<code>rgba(255,255,255,.05)</code>，和夜紫壁纸同一套），整页更统一，代价是六支分类色压深卡要重新一档一档量。</p>
    <p><b>四、开关挂在哪、管几页。</b>那张图是"分享形象"那张，开关在首页（条下那枚「换背景」）。列表铺图只是<b>复用同一张图和同一个开关</b>，列表页不加第二个入口——一个功能只留一个入口。要拍的是这个开关的语义：只管首页，还是"首页和列表一起铺"。按前一条的规矩我倾向一起铺（同一个开关管两页），列表页不再多一个开关。</p>
  </div>`

/* ---------- 装配：十屏 + 两张标注 ---------- */
const flow = document.getElementById('flow')
const RICE = WALLS[0], PURP = WALLS[4]
let html = ''
html += screen('① 中文 · 米白 首屏','D2 画法 + 这一稿六处修正','左侧 176 方块撤掉，分类退到 meta 行那枚 14rpx 点加三个字；底栏和搜索条同一块色，由壁纸派生。',
  L.zh, `${head(L.zh)}${search(L.zh)}${chips(L.zh)}${list(L.zh,6)}`, RICE, 'u1')
html += screen('② 中文 · 夜紫 首屏','深色那一档，同一条规则','卡片底仍是现网那层 5% 白（压页面底 1.11，这条留给阶段 2）；分类字吃深色档，未分类换成空心环。',
  L.zh, `${head(L.zh)}${search(L.zh)}${chips(L.zh)}${list(L.zh,6)}`, PURP)
html += screen('③ 中文 · 搜索中','输入的字和占位符是两个色','占位符那档 62% 只管"还没输入"；一旦有字就是纸白 100%，右边多一个 ✕。结果只剩两条。',
  L.zh, `${head(L.zh)}${search(L.zh,true)}${chips(L.zh)}${list(L.zh,2)}`, RICE)
html += screen('④ 中文 · 空态','之前每一版稿子都漏的一屏','一条笔记都没有时页面长这样。那行字吃 --text-secondary，压页面底实测见标注，要过 4.5。',
  L.zh, `${head(L.zh)}${search(L.zh)}${chips(L.zh)}<div class="empty">${L.zh.empty}</div>`, RICE)
html += screen('⑤ 中文 · 加载','首屏进来之那一瞬','没有内容可看，所以只有那枚转圈加一行字——不画骨架屏（现网没有，也不该顺手加）。',
  L.zh, `${head(L.zh)}${search(L.zh)}${chips(L.zh)}<div class="empty" style="padding:120px 0"><div class="spin"></div>${L.zh.loading}</div>`, RICE)
html += screen('⑥ English · 米白','Same rules, English strings','"Uncategorised" 13 个字符，是 meta 行最宽的一格——所以第 ③ 处那条裁切规则在英文下更要紧。',
  L.en, `${head(L.en)}${search(L.en)}${chips(L.en)}${list(L.en,6)}`, RICE)
html += screen('⑦ English · 夜紫','Dark tier','Category names and note content are user data, not dictionary strings — only 未分类 is ours.',
  L.en, `${head(L.en)}${search(L.en)}${chips(L.en)}${list(L.en,6)}`, PURP)
html += photoScreen('⑧ 中文 · 米白 · A 整页铺','照片铺满视口，卡片一张张压在图上','罩层、裁切、184/1506 全部沿用首页那一套；页头翻纸白，卡片里不翻。',
  L.zh, `${head(L.zh)}${search(L.zh)}${chips(L.zh)}${list(L.zh,6)}`, RICE, 'full')
html += photoScreen('⑨ 中文 · 米白 · C 只铺头部','图只到胶囊下面，列表落在纸上','带子 636 收尾、再 180 淡出，避免一条硬边；第一张卡正好压在淡出段里（顶边 721）。',
  L.zh, `${head(L.zh)}${search(L.zh)}${chips(L.zh)}${list(L.zh,6)}`, RICE, 'band')
html += photoScreen('⑩ English · 米白 · A 整页铺','Same strings, photo behind','英文下照片和罩层是同一串数；页头翻纸白，卡片里的字不翻。',
  L.en, `${head(L.en)}${search(L.en)}${chips(L.en)}${list(L.en,6)}`, RICE, 'full')
html += '<div class="brk"></div>'
html += unit('⑪ 标注','六处修正的出处、八支派生色对表、分类两档实测、还欠什么','表里每一个数都是这页 JS 现算的，不是我抄进稿子的。', DOC, true)
html += unit('⑫ 铺图实测','逐像素量：照片 + 罩层压出来的底，字能不能读','判据不是估的——把 home-bg-portrait.jpg 按 cover 画进 750×1506 画布，逐像素叠上 create.wxss 那串罩层，再叠字色，取这一格里最差的那个像素。', DOC2, true)
flow.innerHTML = html

/* ---------- ⑫ 那一屏：铺图后的对比度逐像素量 ----------
   判据取"格子里最差的那个像素"，不是平均——照片上有一块亮衬衫，平均数会把它糊过去。 */
const SCRIM_STOPS = { full: [[0,.58],[150.6,.58],[647.6,.44],[933.7,.42],[1250,.52],[1325.3,.62],[1506,.72]],
  band: [[0,.58],[300,.50],[636,.44],[816,0]] }
const BAND_H = { full: 1506, band: 816 }
const scrimAt = (mode, y) => {
  const st = SCRIM_STOPS[mode]
  if (y <= st[0][0]) return st[0][1]
  for (let i = 1; i < st.length; i++) if (y <= st[i][0])
    return st[i-1][1] + (st[i][1]-st[i-1][1]) * (y-st[i-1][0]) / (st[i][0]-st[i-1][0])
  return st[st.length-1][1]
}
const mixpx = (a, b, t) => a.map((v,i) => v*(1-t) + b[i]*t)
/* rgba(...) 得按十进制拆，不能塞给那个十六进制解析器——第一版这么写，
   "242,239,233" 被 parseInt(…,16) 截成 0x242，纸白变成了近黑，整张表跟着错 */
const col = (c) => {
  if (c[0] === '#') return [rgb(c), 1]
  const n = c.match(/[\d.]+/g).map(Number)
  return [[n[0], n[1], n[2]], n.length > 3 ? n[3] : 1]
}
const RING = 8   // 这块面往外取 8rpx 那一圈
const TARGETS = [
  { sel:'.h1', name:'页头大标题 我的笔记', fg:'#F2EFE9', need:3.0 },
  { sel:'.stats', name:'三个数 · 这稿画的：纸白 100%', fg:'#F2EFE9', need:4.5 },
  { sel:'.stats', name:'三个数 · 照抄首页那档 78%', fg:'rgba(242,239,233,.78)', need:4.5, tune:1 },
  { sel:'.stats', name:'三个数 · 另一条路：78% 再自己垫一层淡底', fg:'rgba(242,239,233,.78)', pad:'rgba(18,20,26,.42)', need:4.5 },
  { sel:'.chip:not(.on)', name:'未选中胶囊字', fg:'#F2EFE9', pad:'rgba(18,20,26,.42)', need:4.5 },
  { sel:'.chip.on', name:'选中胶囊字', fg:'#23252C', pad:'#F2EFE9', need:4.5 },
  { sel:'.sc', name:'搜索条这块面 压背后（非文本按 3:1）', face:1, need:3.0 },
  { sel:'.tabbar', name:'底栏这块面 压背后（非文本按 3:1）', face:1, need:3.0 },
]
function measurePhotos(){
  const img = document.getElementById('probe')
  if (!img.naturalWidth) return
  const cv = document.createElement('canvas'); cv.width = 750; cv.height = 1506
  const ctx = cv.getContext('2d')
  const sc = Math.max(750/img.naturalWidth, 1506/img.naturalHeight)
  const dw = img.naturalWidth*sc, dh = img.naturalHeight*sc
  const dx = (750-dw)/2, dy = (1506-dh)/2
  ctx.drawImage(img, dx, dy, dw, dh)
  const px = ctx.getImageData(0,0,750,1506).data
  /* C 那条带子钉成和 A 同一份裁切，只是短一截：几何由这里发，不手写进 CSS */
  document.querySelectorAll('.bg.band').forEach(el => {
    el.style.backgroundSize = dw+'px '+dh+'px'; el.style.backgroundPosition = dx+'px '+dy+'px'
  })
  const base = (mode, page, x, y) => {
    if (mode === 'band' && y > BAND_H.band) return rgb(page)
    const a = scrimAt(mode, y)
    const i = (Math.min(1505,Math.max(0,Math.round(y)))*750 + Math.min(749,Math.max(0,Math.round(x)))) * 4
    return mixpx([px[i],px[i+1],px[i+2]], [18,20,26], a)
  }
  const cell = (ph, mode, t) => {
    const pr = ph.getBoundingClientRect(), r = ph.querySelector(t.sel).getBoundingClientRect()
    const st = getComputedStyle(ph)
    const skinHex = st.getPropertyValue('--skin').trim(), page = st.getPropertyValue('--page').trim()
    const [fgc0, fga0] = col(t.fg || '#fff')
    const scan = (fga, over) => {
      const [fgc] = col(over || t.fg || '#fff')
      let worst = 99, seen = 0
      const y0 = r.top-pr.top-184, y1 = y0 + r.height, x0 = r.left-pr.left, x1 = x0 + r.width
      for (let yy = Math.max(0, Math.floor(t.face ? y0-RING : y0)); yy < Math.min(1506, Math.ceil(t.face ? y1+RING : y1)); yy += 2)
        for (let xx = Math.max(0, Math.floor(t.face ? x0-RING : x0)); xx < Math.min(750, Math.ceil(t.face ? x1+RING : x1)); xx += 2) {
          /* 这块面压不压得住，看它四周一圈；身子底下必然撞得上同色的像素，那样量出来永远是 1 */
          if (t.face && xx > x0 && xx < x1 && yy > y0 && yy < y1) continue
          let b = base(mode, page, xx, yy)
          seen++
          if (t.face) { worst = Math.min(worst, cr(hex(b), over || skinHex)); continue }
          if (t.pad) { const pv = col(t.pad); b = mixpx(b, pv[0], pv[1]) }
          const f = fga < 1 ? mixpx(b, fgc, fga) : fgc
          worst = Math.min(worst, cr(hex(b), hex(f)))
        }
      return seen ? r2(worst) : '—'
    }
    let v = scan(fga0)
    /* 不过线的那一档，顺手算出要抬到多少才过；抬到头还不过就照实说不过 */
    if (t.tune && typeof v === 'number' && v < t.need) {
      const full = scan(1)
      let a = fga0
      while (a < 1 && scan(a) < t.need) a = Math.round((a + 0.02) * 100) / 100
      v = full >= t.need ? `${v}｜抬到 ${Math.round(a*100)}% 才过`
        : `<span class="no">${v}</span>｜纸白 100% 也只有 ${full}，抬字色救不回来`
    }
    if (t.face && typeof v === 'number') {
      const paper = scan(1, '#F2EFE9')
      v = `派生 ${v}｜纸白 ${r2(paper)}`
    }
    return v
  }
  const A = document.querySelector('[data-photo="full"]'), C = document.querySelector('[data-photo="band"]')
  document.getElementById('ptb').innerHTML = TARGETS.map(t => {
    const a = cell(A,'full',t), c = cell(C,'band',t)
    const mk = v => typeof v === 'number' ? `<span class="${v>=t.need?'ok':'no'}">${v}</span>` : v
    return `<tr><td>${t.name}</td><td>${mk(a)}</td><td>${mk(c)}</td><td>${t.need}:1</td></tr>`
  }).join('')
  document.getElementById('pgeo').textContent =
    `原图 ${img.naturalWidth}×${img.naturalHeight} → cover 铺进 750×1506：缩放 ${r2(sc)}、画成 ${Math.round(dw)}×${Math.round(dh)}、横向各裁 ${r2(-dx)}rpx。A 与 C 用的是同一份裁切，C 只是 816 以下淡出。`
}

window.addEventListener('load', () => { try { measurePhotos() } catch (e) {
  document.getElementById('ptb').innerHTML = '<tr><td colspan="4">量失败：' + e.message + '</td></tr>' } })

document.getElementById('rh').textContent = m.h.join(' / ')

</script>
