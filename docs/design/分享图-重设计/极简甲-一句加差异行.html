<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
/* 分享封面 · 极简甲：人像 + 品牌行 + 那一句标题 + 一行差异点。
   和上一稿的区别：所有"把标题换个说法再说一遍"的行全部删掉（链接截图随手一句话 /
   摘要要点标签 / 这些地方看到的都能存进来），只留一句和底部那行竞品做不到的事。 */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 1024px; overflow: hidden; }
.card { position: relative; width: 1280px; height: 1024px; background: #F2EFE9;
  font-family: 'PingFang SC', 'Hiragino Sans GB', sans-serif; color: #14161A; }
.photo { position: absolute; right: 0; top: 0; width: 600px; height: 1024px; overflow: hidden; }
.photo img { width: 600px; height: 981px; object-fit: cover; object-position: 46% 10%; }
.fade { position: absolute; right: 440px; top: 0; width: 190px; height: 1024px;
  background: linear-gradient(90deg, #F2EFE9 0%, rgba(242,239,233,0) 100%); }
.brand { position: absolute; left: 88px; top: 96px; display: flex; align-items: center; gap: 20px; }
.brand img { width: 60px; height: 60px; }
.brand span { font-size: 36px; font-weight: 600; letter-spacing: 3px; }
.h1 { position: absolute; left: 88px; top: 330px; width: 660px; font-size: 92px; line-height: 1.24;
  font-weight: 700; letter-spacing: -1px; color: #3F52D6; }
.h1 em { font-style: normal; color: #14161A; }
.diff { position: absolute; left: 88px; bottom: 104px; font-size: 32px; font-weight: 600; color: #14161A; letter-spacing: 1px; }
.diff i { font-style: normal; color: #D2683F; padding: 0 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="photo"><img src="../分享图素材-官网/person.jpg" alt=""></div>
  <div class="fade"></div>
  <div class="brand"><img src="/Users/zlfmac/Documents/TuMaiBiJi/miniprogram/assets/logo.png" alt=""><span>图麦笔记</span></div>
  <div class="h1">把<em>图文</em>提炼成<br>有用的知识</div>
  <div class="diff">零广告<i>·</i>不埋点<i>·</i>免费不限量</div>
</div>
</body>
</html>
