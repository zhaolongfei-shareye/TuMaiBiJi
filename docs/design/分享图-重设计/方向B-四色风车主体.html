<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
/* 方向 B：不出现照片，把 LOGO 那枚四色风车放大成画面主体（四段色取自 palette.js TONES）。 */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 1024px; overflow: hidden; }
.card { position: relative; width: 1280px; height: 1024px; background: #F2EFE9;
  font-family: 'PingFang SC', 'Hiragino Sans GB', sans-serif; color: #14161A; }
.wheel { position: absolute; right: -250px; bottom: -250px; width: 880px; height: 880px; border-radius: 50%;
  background: conic-gradient(#3F52D6 0 90deg, #46A863 90deg 180deg, #E9723D 180deg 270deg, #6E4BD0 270deg 360deg); }
.wheel::after { content: ''; position: absolute; inset: 316px; border-radius: 50%; background: #F2EFE9; }
.sheet { position: absolute; left: 940px; top: 684px; width: 300px; height: 300px; background: #fff;
  border-radius: 44px; box-shadow: 0 30px 70px rgba(20,22,26,.18); padding: 46px 40px; }
.sheet .ln { height: 14px; border-radius: 999px; background: #C9CBD1; margin-bottom: 22px; }
.sheet .ln.s { width: 62%; }
.sheet .tick { position: absolute; right: 40px; bottom: 36px; font-size: 46px; color: #23252C; font-weight: 700; }
.brand { position: absolute; left: 88px; top: 84px; display: flex; align-items: center; gap: 16px; }
.brand img { width: 54px; height: 54px; }
.brand span { font-size: 33px; font-weight: 600; letter-spacing: 2px; }
.h1 { position: absolute; left: 88px; top: 250px; width: 620px; font-size: 112px; line-height: 1.12;
  font-weight: 700; letter-spacing: -2px; }
.h1 .k1 { color: #3F52D6; }
.h1 .k2 { color: #E9723D; }
.sub { position: absolute; left: 88px; top: 660px; width: 560px; font-size: 34px; line-height: 1.5; color: #5C6068; }
.foot { position: absolute; left: 88px; bottom: 84px; display: flex; gap: 14px; align-items: center;
  font-size: 27px; color: #14161A; font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #D2683F; }
</style>
</head>
<body>
<div class="card">
  <div class="wheel"></div>
  <div class="sheet">
    <div class="ln"></div><div class="ln"></div><div class="ln s"></div>
    <div class="tick">✓</div>
  </div>
  <div class="brand">
    <img src="/Users/zlfmac/Documents/TuMaiBiJi/miniprogram/assets/logo.png" alt="">
    <span>图麦笔记</span>
  </div>
  <div class="h1">把<span class="k1">图文</span><br>提炼成<br><span class="k2">有用的知识</span></div>
  <div class="sub">链接、截图、随手一句话<br>丢进来就是一条能搜回来的笔记</div>
  <div class="foot"><span>微信搜「图麦笔记」</span><span class="dot"></span><span>零广告 · 不埋点 · 免费不限量</span></div>
</div>
</body>
</html>
