<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
/* 方向 C：一眼看懂产品在干什么——左边一坨原文，右边一条提炼好的笔记。
   右卡按现网 V2「左块右文」母题画：白底 + 描边 + 左侧分类方块，不投影。 */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 1024px; overflow: hidden; }
.card { position: relative; width: 1280px; height: 1024px; background: #F2EFE9;
  font-family: 'PingFang SC', 'Hiragino Sans GB', sans-serif; color: #14161A; }
.brand { position: absolute; left: 80px; top: 70px; display: flex; align-items: center; gap: 16px; }
.brand img { width: 50px; height: 50px; }
.brand span { font-size: 31px; font-weight: 600; letter-spacing: 2px; }
.h1 { position: absolute; left: 80px; top: 150px; font-size: 74px; font-weight: 700; letter-spacing: -1px; }
.h1 .k { color: #3F52D6; }
.hint { position: absolute; left: 80px; top: 250px; font-size: 28px; color: #5C6068; }

/* 左：原文那三张 */
.raw { position: absolute; left: 80px; top: 340px; width: 470px; height: 500px; }
.raw .p { position: absolute; width: 400px; height: 470px; background: #fff; border: 3px solid rgba(20,22,26,.12);
  border-radius: 24px; padding: 34px 30px; }
.raw .p1 { left: 0; top: 30px; transform: rotate(-5deg); }
.raw .p2 { left: 44px; top: 8px; transform: rotate(3deg); background: #FBFAF7; }
.raw .ln { height: 12px; border-radius: 6px; background: #D8D6D0; margin-bottom: 16px; }
.raw .ln.w1 { width: 88%; } .raw .ln.w2 { width: 96%; } .raw .ln.w3 { width: 70%; }
.raw .shot { margin-top: 22px; height: 120px; border-radius: 16px; background: #E7E4DC;
  border: 3px dashed rgba(20,22,26,.16); }
.raw .cap { position: absolute; left: 0; bottom: -6px; font-size: 25px; color: #9A9EA6; }

.arrow { position: absolute; left: 576px; top: 570px; width: 108px; height: 8px; background: #D2683F; }
.arrow::after { content: ''; position: absolute; right: -6px; top: -17px; width: 40px; height: 40px;
  border-top: 8px solid #D2683F; border-right: 8px solid #D2683F; transform: rotate(45deg); }

/* 右：提炼好的那条笔记 */
.note { position: absolute; left: 700px; top: 322px; width: 500px; height: 566px; background: #fff;
  border: 3px solid rgba(20,22,26,.12); border-radius: 40px; padding: 40px 36px; }
.note .row { display: flex; gap: 24px; align-items: flex-start; }
.note .block { width: 96px; height: 96px; border-radius: 24px; background: #46A863; color: #06260F;
  display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; }
.note .t { font-size: 40px; font-weight: 700; line-height: 1.3; }
.note .s { margin-top: 10px; font-size: 27px; color: #5C6068; }
.note .pts { margin-top: 30px; }
.note .pt { display: flex; gap: 14px; font-size: 27px; line-height: 1.55; color: #14161A; }
.note .pt i { font-style: normal; color: #3F52D6; font-weight: 700; }
.note .tags { position: absolute; left: 36px; bottom: 40px; display: flex; gap: 12px; }
.note .tg { padding: 10px 22px; border-radius: 999px; background: rgba(35,37,44,.06); font-size: 25px; color: #5C6068; }
.foot { position: absolute; left: 80px; bottom: 56px; font-size: 27px; color: #14161A; font-weight: 600; }
.foot b { color: #D2683F; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img src="/Users/zlfmac/Documents/TuMaiBiJi/miniprogram/assets/logo.png" alt=""><span>图麦笔记</span>
  </div>
  <div class="h1">把<span class="k">图文</span>提炼成有用的知识</div>
  <div class="hint">丢进来的是文章和截图，留下的是摘要、要点、标签</div>

  <div class="raw">
    <div class="p p1"><div class="ln w2"></div><div class="ln"></div><div class="ln w2"></div><div class="ln w3"></div><div class="ln"></div><div class="ln w2"></div></div>
    <div class="p p2"><div class="ln w2"></div><div class="ln"></div><div class="ln w3"></div><div class="shot"></div><div class="cap">链接 · 截图 · 手写</div></div>
  </div>
  <div class="arrow"></div>
  <div class="note">
    <div class="row">
      <div class="block">旅行</div>
      <div><div class="t">厦门三日路线</div><div class="s">鼓浪屿早去早回，沙坡尾看日落</div></div>
    </div>
    <div class="pts">
      <div class="pt"><i>·</i>轮渡提前一天订，别现场排队</div>
      <div class="pt"><i>·</i>岛上骑车比走路省一半时间</div>
      <div class="pt"><i>·</i>傍晚五点后沙坡尾光线最好</div>
    </div>
    <div class="tags"><div class="tg">旅行</div><div class="tg">福建</div><div class="tg">攻略</div></div>
  </div>

  <div class="foot">微信搜「图麦笔记」 · 零广告 · 不埋点 · <b>免费不限量</b></div>
</div>
</body>
</html>
