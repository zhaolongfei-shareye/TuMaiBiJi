<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
/* 分享封面 · 极简乙：照片整张出血当底，字压在暗部上。
   和甲的差别只在承载：甲是"纸 + 照片贴右边"，乙是"照片就是纸"，字浮在上面。 */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 1024px; overflow: hidden; }
.card { position: relative; width: 1280px; height: 1024px; background: #14161A;
  font-family: 'PingFang SC', 'Hiragino Sans GB', sans-serif; color: #F2EFE9; }
.photo { position: absolute; inset: 0; }
.photo img { width: 1280px; height: 1024px; object-fit: cover; object-position: 74% 18%; }
.scrim { position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(16,17,20,.94) 0%, rgba(16,17,20,.82) 34%, rgba(16,17,20,.18) 62%, rgba(16,17,20,0) 82%); }
.brand { position: absolute; left: 88px; top: 96px; display: flex; align-items: center; gap: 20px; z-index: 3; }
.brand img { width: 60px; height: 60px; }
.brand span { font-size: 36px; font-weight: 600; letter-spacing: 3px; }
.h1 { position: absolute; left: 88px; top: 336px; width: 600px; font-size: 96px; line-height: 1.18;
  font-weight: 700; letter-spacing: -1px; z-index: 3; }
.h1 span { color: #F6C445; }
.diff { position: absolute; left: 88px; bottom: 104px; z-index: 3; font-size: 31px; font-weight: 600; letter-spacing: 1px; }
.diff i { font-style: normal; color: #E9723D; padding: 0 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="photo"><img src="../分享图素材-官网/person.jpg" alt=""></div>
  <div class="scrim"></div>
  <div class="brand"><img src="/Users/zlfmac/Documents/TuMaiBiJi/miniprogram/assets/logo.png" alt=""><span>图麦笔记</span></div>
  <div class="h1">把<span>图文</span>提炼成<br>有用的知识</div>
  <div class="diff">零广告<i>·</i>不埋点<i>·</i>免费不限量</div>
</div>
</body>
</html>
