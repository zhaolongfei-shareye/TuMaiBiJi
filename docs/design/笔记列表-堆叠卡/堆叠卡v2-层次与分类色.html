<style>

     "再模拟多几个笔记折叠效果；前面的笔记边框压住后面的，看上去有上下层次关系；
      每个标题前面的小圆点要有颜色区分，当前笔记标题前面也要有一个，
      这个颜色和笔记分类关联，上面分类底图也用不同颜色，看起来不会太寡淡；
      背景图不要漏了。"

   四条屏：① 默认堆叠（中心 + 上下各三，一屏看得见 7 条，压叠关系画出来）
           ② 点开放大看完整   ③ 上下滑切换中   ④ 英文默认态

   口径与代码同一把尺子：px 当 rpx 用，设计宽 750；
     一屏 = 外框 184（状态栏 94 + 导航条 90）+ 视口 1506 = 1690。
     背景引线上原图 miniprogram/assets/home-bg-portrait.jpg（865×1670），cover，
     压暗停点逐字抄 create.wxss；底栏那支色是 palette.chromeOf('tint-celadon') = #25442B。
     圆角、字阶、描边、底栏几何与现网 app.wxss 逐值相同。
     分类那六支色全部从 palette.TONES / UNCATEGORIZED 现取（见标注页那张对照表），
     屏上每一句界面中文都从 utils/i18n.js 抄，新造的串单列。
   ================================================================== */
  :root{

    --paper:#F2EFE9; --ink:#23252C;
    --fs-h1:42px; --fs-title:31px; --fs-body:28px; --fs-meta:24px; --fs-tiny:21px; --fs-label:20px;
    --chrome:#25442B; --chrome-line:rgba(242,239,233,.22); --chrome-idle:rgba(242,239,233,.68);
    --card:#FCFBF8; --card-edge:rgba(36,30,22,.12);
    /* 分类六支：palette.js 的 TONES + UNCATEGORIZED，一字未改 */
    --c-yellow:#F6C445; --i-yellow:#2A2005;
    --c-blue:#3F52D6;   --i-blue:#FFFFFF;
    --c-orange:#E9723D; --i-orange:#2C1204;
    --c-green:#46A863;  --i-green:#06260F;
    --c-purple:#6E4BD0; --i-purple:#FFFFFF;
    --c-ink:#23252C;    --i-ink:#FFFFFF;

  .cap h3{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.3;margin-bottom:6px}
  .cap p{font-size:16px;line-height:1.62;color:#55595f}
  .cap b{color:#23252C}

  .ph{width:750px;height:1690px;position:relative;overflow:hidden;background:#E9EEEA;border-radius:52px;

  .ph.doc{height:auto;padding-bottom:26px}
  .bg{position:absolute;left:0;top:184px;width:750px;height:1506px;background-size:cover;background-position:center;z-index:0}

      rgba(18,20,26,.44) 43%,rgba(18,20,26,.42) 62%,

  .lay{position:absolute;left:0;top:184px;width:750px;height:1506px;z-index:2}

  .sb{height:94px;display:flex;align-items:center;justify-content:space-between;padding:0 40px 0 48px;

  .sb .right{display:flex;align-items:center;gap:10px}
  .sig{display:flex;gap:4px;align-items:flex-end}

  .bat::after{content:'';position:absolute;left:3px;top:3px;bottom:3px;right:14px;background:currentColor;border-radius:2px}
  .nb{height:90px;background:#181A20;position:relative;z-index:12}
  .nb .t{position:absolute;left:0;right:174px;top:0;height:88px;display:flex;align-items:center;justify-content:center;

  .hero{position:absolute;left:24px;right:24px;top:45px;display:flex;align-items:baseline;justify-content:space-between}

  .hero .stats{font-size:var(--fs-meta);font-weight:600;color:rgba(242,239,233,.95);white-space:nowrap}

  .spill .rule{position:absolute;left:34px;right:120px;bottom:24px;height:3px;background:var(--ink);opacity:.42}

  /* 分类筛选：每一枚直接穿自己那一支分类色（他要的"不寡淡"就是这个）。
     枚内不再画小圆点——底色已经是那一支色，点同色等于没有；六枚要在一行内排满 702。 */
  .chips{position:absolute;left:24px;right:24px;top:306px;height:56px;display:flex;gap:12px;overflow:hidden}
  .chip{height:56px;flex:none;border-radius:var(--r-pill);display:flex;align-items:center;
    font-size:var(--fs-meta);font-weight:700;white-space:nowrap;padding:0 26px;
    box-shadow:0 6px 16px rgba(8,10,14,.28)}
  .chip.all{background:var(--paper);color:var(--ink)}
  .chip.on{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 var(--w-edge) var(--tone),0 6px 16px rgba(8,10,14,.28)}

  /* ---------- 堆叠：靠中心的压住靠外的，中心压住全部 ---------- */
  .stack{position:absolute;left:0;right:0;top:420px;height:792px}
  .card{position:absolute;border-radius:var(--r-card);background:var(--card);

  .card .dot{width:16px;height:16px;border-radius:50%;flex:none}
  .card .ti{flex:1;min-width:0;font-size:var(--fs-body);font-weight:700;letter-spacing:-.5px;color:#23252C;

  .card .dt{flex:none;font-size:var(--fs-tiny);font-weight:800;letter-spacing:.4px;color:rgba(35,37,44,.5)}
  /* 折叠条：只露一行标题。左右往里收、往下/往上叠，越远越小越淡 */
  .f1{left:56px;right:56px;height:76px;z-index:4;opacity:.9;transform:scale(.975)}
  .f2{left:88px;right:88px;height:76px;z-index:2;opacity:.68;transform:scale(.95)}
  .f3{left:118px;right:118px;height:76px;z-index:1;opacity:.45;transform:scale(.925)}
  .u3{top:0}
  .u2{top:62px}
  .u1{top:124px}
  .d1{top:592px}
  .d2{top:654px}
  .d3{top:716px}
  /* 中心卡：最高一层，上下两条边各压住相邻折叠条 14 */
  .center{left:24px;right:24px;top:186px;height:420px;z-index:6;opacity:1;transform:none;
    flex-direction:column;align-items:stretch;padding:32px 30px 26px;
    box-shadow:0 24px 56px rgba(8,10,14,.4)}
  .center .hd{display:flex;align-items:flex-start;gap:14px}
  .center .dot{margin-top:14px}
  .center .ti{font-size:36px;font-weight:800;letter-spacing:-.8px;line-height:1.3;color:#23252C;white-space:normal;overflow:hidden}
  .center .pin{display:inline-block;font-size:19px;font-weight:800;letter-spacing:.6px;padding:4px 14px;
    border-radius:10px;background:#23252C;color:#E9EEEA;margin-right:10px;vertical-align:3px}
  .center .su{margin-top:16px;font-size:var(--fs-body);line-height:1.65;color:#5c6068;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .center .foot{margin-top:auto;padding-top:18px;border-top:var(--w-edge) solid rgba(35,37,44,.10);
    display:flex;align-items:center;gap:11px;white-space:nowrap;font-size:var(--fs-meta);color:#5c6068}
  .center .foot .cat{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--tone);flex:none}
  .center .foot .cat i{width:14px;height:14px;border-radius:50%;background:var(--tone);flex:none}
  .center .foot .sep{color:rgba(35,37,44,.35)}
  .center .foot .tg{overflow:hidden;text-overflow:ellipsis;color:rgba(35,37,44,.42);min-width:0}
  .center .foot .dt{margin-left:auto;font-weight:800;letter-spacing:.4px;flex:none;color:#5c6068}
  .center .foot .cv{font-size:var(--fs-body);color:rgba(35,37,44,.42)}

  .hint{position:absolute;left:0;right:0;top:838px;text-align:center;font-size:var(--fs-tiny);

  .pager{position:absolute;left:0;right:0;top:880px;display:flex;justify-content:center;gap:12px}
  .pager i{width:12px;height:12px;border-radius:50%;background:rgba(242,239,233,.34)}
  .pager i.on{background:var(--paper);width:34px;border-radius:999px}

  /* 展开态：这张按内容定高，不铺满整屏——铺满就得拿假留白去填，照片反而又被盖掉了 */
  .lay.dim{opacity:.14}
  .bigcard{position:absolute;left:24px;right:24px;top:120px;border-radius:var(--r-card);
    background:var(--card);border:var(--w-edge) solid var(--card-edge);box-shadow:0 26px 64px rgba(8,10,14,.5);
    padding:38px 34px 26px;overflow:hidden}
  .bigcard .hd{display:flex;align-items:flex-start;gap:16px}
  .bigcard .dot{width:20px;height:20px;border-radius:50%;flex:none;margin-top:14px;background:var(--tone)}
  .bigcard .ti{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.34;color:#23252C}
  .bigcard .band{margin-top:22px;height:8px;border-radius:999px;background:var(--tone);opacity:.85}
  .bigcard .lab{margin-top:26px;font-size:var(--fs-label);font-weight:800;letter-spacing:1.6px;color:rgba(35,37,44,.42)}
  .bigcard .su{margin-top:12px;font-size:var(--fs-body);line-height:1.7;color:#3a3e46}
  .bigcard .kpl{margin-top:14px;display:flex;flex-direction:column;gap:14px}
  .bigcard .kpl .row{display:flex;gap:14px;font-size:var(--fs-body);line-height:1.55;color:#23252C}
  .bigcard .kpl .row i{width:10px;height:10px;border-radius:50%;background:var(--tone);flex:none;margin-top:16px}
  .bigcard .src{margin-top:14px;font-size:var(--fs-meta);color:rgba(35,37,44,.55)}
  .bigcard .src b{font-weight:700;color:var(--tone)}
  .bigcard .close{margin-top:28px;padding-top:20px;border-top:var(--w-edge) solid rgba(35,37,44,.10);
    display:flex;align-items:center;justify-content:space-between;font-size:var(--fs-meta);font-weight:700;color:rgba(35,37,44,.5)}
  .bigcard .close .chev{font-size:34px;line-height:1}

  .tabbar{position:absolute;left:24px;right:24px;bottom:20px;height:108px;border-radius:44px;
    background:var(--chrome);display:flex;z-index:10;box-shadow:0 16px 44px rgba(0,0,0,.42);
    border:var(--w-edge) solid var(--chrome-line)}
  .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;

      <p>所以这一稿屏上画的是<b>原色</b>，等于提议：<b>列表这一处的点改吃 <code>toneFor(id).bg</code>（原色），不再吃 <code>catSkinFor</code> 的加深档</b>；分类名那一行文字仍走 <code>catSkinFor.text</code>，对比不塌。这条一改，天青下也五色分明；不改，就得接受"换天青=点同色"。这是第一件要拍的事，比下面那三件都大。</p></div>
