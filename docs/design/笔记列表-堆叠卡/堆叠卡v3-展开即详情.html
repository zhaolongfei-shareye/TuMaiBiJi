/* ==================================================================
   站长 09-29 拍下来的两条（原话摘要）：
     一、"展开就是详情页，页面过长可以在窗口内滚动，所有操作都把按钮上移、不受页面滚动影响。
          这个版本做减法，尽量让用户减少不必要的跳转和页面。分享图直接在这页面中渲染：
          点击分享图按钮，上面详情页就直接切换成分享图预览效果。如果要切换不同的卡片模板，
          提供左右切换操作就可以，直接预览。每个效果图有小吐司，提醒模板名字。
          保存成功后，恢复到展开页即详情页。"
     二、"折叠条不露摘要。一屏 5 条，在最上和最下增加动感横条，提醒还有。如果拖到头就不动。"

   六屏：① 默认堆叠（5 条 + 上下动感横条）  ② 拖到最顶那一态（上端横条停住）
         ③ 展开＝详情页（窗口内滚、操作吸底）  ④ 点「转为笔记卡片」→ 同一窗口出海报
         ⑤ 左右滑换模板（两张错位 + 模板名小吐司）  ⑥ 保存成功 → 回到详情页
   这一稿只画中文：结构还没定，先不出英文版。

   口径与代码同一把尺子：px 当 rpx 用，设计宽 750；一屏 = 外框 184（状态栏 94 + 导航条 90）+ 视口 1506 = 1690。
   背景引线上原图 miniprogram/assets/home-bg-portrait.jpg（865×1670），cover；压暗停点逐字抄 create.wxss。
   底栏那支色是 palette.chromeOf('tint-celadon') = #25442B。
   详情页里那几块的顺序、按钮、每一句文案，逐条对 miniprogram/pages/detail/detail.wxml；
   海报预览用的是 docs/design/模板成品-1.5.0/ 里那 10 张真成品图（各自真实宽高比），不是手画的假海报。
   ================================================================== */

      <p>到头规则：<b>第一条时上端那根停在原地</b>（不再呼吸、淡到 .22、撤箭头），下端照常；最后一条时反过来。中间位置两根都动。这样"还能不能滑"这件事不用看数字也知道。</p>

    <div class="blk2"><h4>模板切换：左右滑的顺序与到头</h4>
      <p>现网 <code>utils/poster.js</code> 的 <code>TEMPLATES</code> 一共十套，分两组（经典款四套、个性款六套），名字逐字是：<b>玉版宣、摘句、叠翠、素宣信笺</b>（经典款）｜<b>波普分格、网点漫画、荧光渐变、杂志封面、纸间文艺、规格卡</b>（个性款）。左右滑就按这个数组顺序走，<b>不循环</b>——到第十套再往左滑不动，和列表那根横条是同一条规则。每切一套弹一个小吐司报名字（现网 <code>wx.showToast</code> 那种居中深灰块，无图标）。</p>
      <p>屏上那三张海报<b>不是手画的假图</b>，是 <code>docs/design/模板成品-1.5.0/</code> 里模拟器出的真成品（玉版宣 750×1077、叠翠 750×1154、素宣信笺 750×1188，各自真实比例），按现网那条规则放进定高框里等比居中——所以切模板时框子不跳、图自己变大小。<b>有一条要交代清</b>：那三张成品图当时是拿「2026微信小程序开发大赛介绍」那条笔记画的，而这一稿展开的是淡路岛那条，<b>海报上的文字和屏上这条笔记对不上</b>。版位、比例、模板长相是真的，文字内容不是同一篇，落地时同一篇重画就一致了。</p></div>
    <div class="blk2"><h4>落地前必须先解的一个坑（现网注释里已经踩过）</h4>
      <p><code>pages/share/share.wxml</code> 顶上那段注释写着：<b>"试过把小图那排钉进底部固定条——画布是原生层，放进 fixed 里会整体错位，已回退。"</b> 这一版要做的正是把海报塞进一个吸底的窗口里，撞的就是这条。所以落地时预览<b>不能直接放 <code>canvas type="2d"</code></b>：改成把画布挪到窗口外（或 <code>position:fixed</code> 之外）离屏画完，<code>canvasToTempFilePath</code> 出图，窗口里用 <code>&lt;image&gt;</code> 显示成品。这样左右滑切模板 = 换 image 的 src + 重画下一张，原生层不参与布局，就不会错位。<b>代价是切模板那一瞬会先看到上一张、再跳到新图</b>，所以吐司要盖住这一瞬，或者先出一张同底色的占位。这条要在动手前实测一遍能不能真的不错位——我说的"改成 image 就干净"目前只是推断，没跑过。</p></div>

    <div class="blk2"><h4>还等你拍的（第二稿那几条你没答，我按原样留着）</h4>
      <p><b>一、列表那枚点吃原色还是吃加深档。</b>这条最要紧：你现在用天青壁纸，现网 <code>catSkinFor</code> 会把五支分类色全压成同一支绿（芥末黄→#527358、宝蓝→#53735b、橙→#55725d、草绿→#54735d、紫→#40604A、墨黑→#1B2A21），"点要颜色区分"用现成函数做不到。这一稿屏上画的还是<b>色板原色</b>，等于默认你同意"列表这点改吃 <code>toneFor(id).bg</code>、文字仍吃 <code>catSkinFor.text</code>"。不同意我就把屏上的点全换成右边那一列绿。</p>
      <p><b>二、筛选枚穿实色后，选中态怎么区分。</b>这版画的还是第二稿那套：未选中 = 该分类实色底 + 配好的字色；选中 = 纸白底 + 该色字 + 该色描边。</p>
      <p><b>三、墨黑那一档。</b>他那三条真笔记都在未分类，点全是墨黑，看着还是灰的。我倾向不改色板，让他把这几条归类。</p>
      <p><b>四、操作条钉下沿还是上沿。</b>你说的"把按钮上移"我理解成"从滚动区里抬出来、钉住不动"，画在窗口<b>下沿</b>（拇指够得着）。如果你要的是钉在窗口<b>上沿</b>，那是另一版排法，说一声。</p>
      <p><b>五、展开态标题下那条分类色带（第二稿加的）。</b>这一稿按你说的"展开就是详情页"改回现网详情版的方块 + 文字，那条色带自然没了——确认一下这是你要的。</p></div>
    <div class="blk2"><h4>落地代价（先说清，等你拍完再动）</h4>
      <p>这一版不是"改样式"，是<b>把两个页面收进首页的一个态</b>。要动的地方：首页 data 里加"当前下标 + 展开/收起 + 海报预览开/关 + 当前模板 id"；detail 页那套取数与渲染逻辑（含原文折叠、撤分享、置顶）搬进首页组件；share 页的画海报流程改成离屏画 + image 显示；<code>app.json</code> 里 detail 和 share 两个路由<b>先留着别删</b>——分享落地页、通知跳转、以及"从别处直接打开某篇"都还指着它们，删了会断链。所以真实的减法是把<b>列表 → 详情 → 分享</b>这三跳压成一屏内的手势，不是删两个文件。</p>
      <p>风险三条：① 原生 canvas 与吸底窗口的错位（上面那一整块）；② 窗口内滚动用 <code>scroll-view</code>，它和"上下滑切笔记"的手势会打架——滚到顶还继续往下拽才算切条，这条得实测手感；③ 首页一次要备着 5 张卡的完整数据（中心那张要摘要 + 要点 + 标签），现在列表接口回的是精简字段，得确认 <code>/api/notes</code> 的字段够不够，不够就多带一列。</p></div>
