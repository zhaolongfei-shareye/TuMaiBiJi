/* ==================================================================
   站长 09-29 第五轮拍板（这一稿改的）：
   "在拉起笔记卡片模板时候，不要把后面的笔记展示出来，这会影响感观，例如用毛玻璃效果作为背景。
    笔记模板选择预览是在原笔记详情页渲染，看上去是完整的弹窗，然后，保存或者取消后，再消失，
    恢复到详情页状态。为了加快速度，效果图你只需要生成中文版即可。"
   → 改④⑤两屏：海报预览还是详情那个窗口原位换内容（几何一字未动），变的是窗口外的背景——
     整层毛玻璃：底下内容整体虚化 blur 24 + 纸色薄雾 62%。「我的笔记」/搜索条/五枚分类色块
     只剩柔和色影，文字不可辨，整个看上去是一个完整的弹窗。
     怎么关：取消 / 保存成功 / 点一下把手，三个口都收掉弹窗回详情（⑥），毛玻璃跟着撤、
     背景恢复清晰。
   这一轮只出中文六屏（站长原话"只生成中文版"）；英文字串出处与第五/六稿同一条，落地照抄。
   其余一字未动：预览整卡（第六稿）、收起行 124、动感横条、详情窗、海报内容、字符串零新串。

   六屏：① 默认（列表顶，第一条整卡展开） ② 点第二条 → 卡片挪过去
         ③ 点开着的卡 → 详情窗口  ④ 转为笔记卡片 → 完整弹窗出海报（毛玻璃垫底）

   口径与代码同一把尺子：px 当 rpx 用，设计宽 750；一屏 = 外框 184（状态栏 94 + 导航条 90）+ 视口 1506 = 1690。
   背景引线上原图 miniprogram/assets/home-bg-portrait.jpg（865×1670），cover；压暗停点逐字抄 create.wxss。

   详情页里那几块的顺序、按钮、每一句文案，逐条对 miniprogram/pages/detail/detail.wxml；
   海报预览用的是 docs/design/模板成品-1.5.0/ 里那 10 张真成品图（各自真实宽高比），不是手画的假海报。
   ================================================================== */

  { ti:'TVB新晋HiFi女歌手——侯静伊', cat:'ink', src:'wechat', tag:'侯静伊 / TVB / HiFi歌手 / 中年好声音', dt:'09-25',
    su:'侯静伊（Connie Hau）是香港 HiFi 女歌手及 TVB 签约艺人，自幼学声乐并获逾 60 项歌唱奖项。她自 2019 年出道已推出三张专辑。' },
  { ti:'2026年中秋节祝福语与问候图片大全', cat:'ink', src:'wechat', tag:'平安喜乐 / 中秋节 / 祝福语 / 问候图片', dt:'09-25',
    su:'本文汇集了 2026 年中秋节的多条温馨祝福语，配合最美问候图片，传达花好月圆、阖家团圆的美好祝愿。' },

    su:'生驹的濑户内海眺望、安藤忠雄的图书馆，营地要提前一个月订。岛上公交两小时一班，末班五点半，错过就得打车，一段路约三千日元。南淡路的海上散步道留着半天，退潮时能看到底下的礁石。',

/* 列表顺序：置顶在最上，其余按日期倒序——和现网首页同一条规则 */
const ORDER = [0, 4, 1, 2, 3, 5, 6]
const KP = ['两个营地都要提前一个月订，周末基本秒空','安藤忠雄的图书馆只在下午四点前开放，需预约',
            '岛上公交两小时一班，末班 17:30，行程要按班车排','南淡路海上散步道退潮时段最好走，单程约 40 分钟']

const L = {
  zh:{ nav:'图麦笔记', head:'我的笔记', stats:'本周：3　|　本月：5　|　总数：7',
    ph:'输入关键词', go:'搜索笔记', all:'全部',
    unpin:'取消置顶', edit:'编辑', del:'删除',
    summary:'摘要', keyPoints:'核心要点', sourceLink:'来源链接',

    qr:'带二维码', qrHint:'发到微信以外的平台容易被屏蔽，可关掉只留文字',

}

/* utils/poster.js 的 TEMPLATES：十条、按数组顺序；中文名逐字抄 label */
const TPLS = [

  { id:'quote', zh:'摘句', en:'Verse Slip', f:'模板-quote.png' },

const mk = (T) => {
  const tabbar = `
    <div class="tabbar">
      <div class="tb create"><div class="ic"></div>${T.tab[0]}<div class="ln"></div></div>
      <div class="tb notes on"><div class="ic"></div>${T.tab[1]}<div class="ln"></div></div>
      <div class="tb me"><div class="ic"></div>${T.tab[2]}<div class="ln"></div></div>
    </div>`

  const shell = (inner) => `
    <div class="sb"><span>23:03</span><span class="right"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="bat"></span></span></div>
    <div class="nb"><span class="t">${T.nav}</span><span class="capsule"><span class="dots"><i></i><i></i><i></i></span><span class="dv"></span><span class="cls"></span></span></div>
    <div class="bg" style="background-image:url('${IMG}')"></div><div class="scrim"></div>
    ${inner}
    ${tabbar}`

  /* ④/⑤ 专用：导航条以下整层进 .under 整体虚化，再蒙 .frost 纸色薄雾；
     弹窗本体（.sheet）在毛玻璃之上，z:9。状态栏与导航条保持清晰。 */
  const modalShell = (sheetInner) => `
    <div class="sb"><span>23:03</span><span class="right"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="bat"></span></span></div>
    <div class="nb"><span class="t">${T.nav}</span><span class="capsule"><span class="dots"><i></i><i></i><i></i></span><span class="dv"></span><span class="cls"></span></span></div>
    <div class="under">
      <div class="bg" style="background-image:url('${IMG}')"></div><div class="scrim"></div>
      <div class="lay">
        <div class="hero"><div class="h1">${T.head}</div><div class="stats">${T.stats}</div></div>
        <div class="spill"><div class="q">${T.ph}</div><div class="go">${T.go}</div><div class="rule"></div></div>
        <div class="chips"><div class="chip all">${T.all}</div>${chip('green')}${chip('orange')}${chip('blue')}${chip('purple')}</div>
      </div>
      ${tabbar}
    </div>
    <div class="frost"></div>
    <div class="lay" style="z-index:9"><div class="sheet">${sheetInner}</div></div>`

  const chip = (k) => `<div class="chip" style="background:${CAT[k].bg};color:${CAT[k].ink}">${CAT[k].name}</div>`

  const head = () => `
    <div class="lay">
      <div class="hero"><div class="h1">${T.head}</div><div class="stats">${T.stats}</div></div>
      <div class="spill"><div class="q">${T.ph}</div><div class="go">${T.go}</div><div class="rule"></div></div>
      <div class="chips"><div class="chip all">${T.all}</div>${chip('green')}${chip('orange')}${chip('blue')}${chip('purple')}</div>
    </div>`

  /* 一行：收起态 = 点+标题+日期（第四稿原样）；
     预览态 = 站长拍的那张卡（第三稿中心卡画法）：大标题 / 整四行概要 / meta 脚行（分类·来源·标签·日期·›） */
  const row = (n, top, peek) => peek
    ? `<div class="row ex" style="top:${top}px">
        <div class="hd"><span class="dot" style="background:${CAT[n.cat].bg}"></span><span class="ti">${n.ti}</span></div>
        <div class="su">${n.su || ''}</div>
        <div class="foot">
          <span class="cat" style="color:${CAT[n.cat].bg}"><i style="background:${CAT[n.cat].bg}"></i>${CAT[n.cat].name}</span>
          <span class="sep">·</span><span class="src">${SRC[n.src][0]}</span>
          <span class="sep">·</span><span class="tg">${n.tag}</span>
          <span class="dt">${n.dt}</span><span class="cv">›</span>
        </div></div>`
    : `<div class="row" style="top:${top}px"><span class="dot" style="background:${CAT[n.cat].bg}"></span><span class="ti">${n.ti}</span><span class="dt">${n.dt}</span></div>`

  /* 可见五条的行位：第 k 条（0 起）开着卡——开着那条占 381（362 高 + 19 缝），其余 143 一档。
     放不下的那条被 .rows 裁掉一条边，下端横条就压在这条边上。 */
  const listRows = (k) => {
    let y = 48
    const out = []
    for (let i = 0; i < 5; i++) {
      out.push(row(NOTES[ORDER[i]], y, i === k))
      y += (i === k ? 381 : 143)
    }
    return out.join('')
  }

  /* ① 默认：列表停在顶上——第一条（置顶）整卡展开；上端横条是"到头"的停住态，下端照常 */
  const S1 = shell(head() + `
    <div class="lay"><div class="rows">
      <div class="mb mt stay"></div>
      ${listRows(0)}
      <div class="mb mb2"></div>
    </div></div>`)

  /* ② 点第二条：卡片挪过去，第一条收回标题行 */
  const S2 = shell(head() + `
    <div class="lay"><div class="rows">
      <div class="mb mt stay"></div>
      ${listRows(1)}
      <div class="mb mb2"></div>
    </div></div>`)

  /* ③ 详情那一屏：内容还是 pages/detail/detail.wxml 那几块，顺序一字不差；
     差别三处——色彩方块撤掉换成纯文字抬头、操作条钉在窗口下沿、顶部多一条把手。
     注意：这一步背景还是清晰的，毛玻璃只在模板预览弹窗那一步上。 */
  const detailBody = `
    <div class="hd2">
      <div class="meta">${SRC[NOTES[3].src][0]} · 2026-09-24 21:14</div>
      <div class="h2">${NOTES[3].ti}</div>
      <div class="tags">${NOTES[3].tag.split(' / ').map((x) => `<span>${x}</span>`).join('')}</div>
    </div>
    <div class="lab">${T.summary}</div>
    <div class="para">${NOTES[3].su}</div>
    <div class="lab">${T.keyPoints}</div>
    <div class="pts">${KP.map((k, i) => `<div class="r"><div class="n">${i + 1}</div><div class="x">${k}</div></div>`).join('')}</div>
    <div class="lab">${T.sourceLink}</div>
    <div class="link">${NOTES[3].url}</div>
    <div class="orig"><div class="lab ln">${T.original}</div><div class="sw">${T.expand} ⌄</div></div>`

  const dockDetail = `
    <div class="dock">
      <div class="irow">
        <div class="ibtn">${T.unpin}</div>
        <div class="ibtn">${T.edit}</div>
        <div class="ibtn danger">${T.del}</div>
      </div>
      <div class="pbtn">${T.shareAsImage}</div>
      <div class="pub"><span class="l"><b>·</b> ${T.sharedNow}</span><span class="act">${T.unshare}</span></div>
    </div>`

  const S3 = shell(head() + `
    <div class="lay"><div class="rows">${listRows(1)}</div></div>
    <div class="lay" style="z-index:9"><div class="sheet">
      <div class="grip"><i></i><em>${T.grip}</em></div>
      <div class="body" style="--tone:${CAT.green.bg}">${detailBody}<div class="fade"></div></div>
      ${dockDetail}
    </div></div>`)

  const dockPoster = `
    <div class="dock">
      <div class="qr"><div class="pill"><i></i></div><div class="tx"><b>${T.qr}</b><span>${T.qrHint}</span></div></div>
      <div class="two" style="margin-top:20px">
        <div class="pbtn ghost">${T.cancel}</div>
        <div class="pbtn">${T.save}</div>
      </div>
    </div>`

  /* ④ 点「转为笔记卡片」：详情窗口原位换成海报预览，窗口外整层毛玻璃——
     后面的列表头、搜索、分类色块虚成柔和色影，整个是一个完整弹窗。
     关掉弹窗的口：取消、保存成功、点一下把手，都回详情页。 */
  const S4 = modalShell(`
      <div class="grip"><i></i><em>${T.grip}</em></div>
      <div class="pbox"><img src="${POSTER}${TPLS[0].f}">
        <div class="swipe"><span class="ar">‹</span>${T.swipeHint}<span class="ar">›</span></div>
        <div class="toast">${TPLS[0].zh}</div>
      </div>
      ${dockPoster}`)

  /* ⑤ 左右滑换模板中：三张并排，中间是当前的；吐司报出刚切到的名字。毛玻璃垫底不变 */
  const S5 = modalShell(`
      <div class="grip"><i></i><em>${T.grip}</em></div>
      <div class="pbox"><div class="pair">
        <img class="a" src="${POSTER}${TPLS[1].f}">
        <img class="c" src="${POSTER}${TPLS[2].f}">
        <img class="b" src="${POSTER}${TPLS[3].f}">
      </div>
        <div class="swipe"><span class="ar">‹</span>${T.swipeHint}<span class="ar">›</span></div>
        <div class="toast">${TPLS[2].zh}</div>
      </div>
      ${dockPoster}`)

  /* ⑥ 保存成功：弹窗连同毛玻璃一起收掉，窗口回到详情页（不是回列表），背景恢复清晰 */
  const S6 = shell(head() + `
    <div class="lay"><div class="rows">${listRows(1)}</div></div>
    <div class="lay" style="z-index:9"><div class="sheet">
      <div class="grip"><i></i><em>${T.grip}</em></div>
      <div class="body" style="--tone:${CAT.green.bg}">${detailBody}<div class="fade"></div></div>
      ${dockDetail}
      <div class="toast" style="top:46%"><div class="tick"></div>${T.saved}</div>
    </div></div>`)

  return [S1, S2, S3, S4, S5, S6]
}

const [C1, C2, C3, C4, C5, C6] = mk(L.zh)

const UNIT = (step, title, note, inner) => `

const DOC = `
  <div class="sb" style="background:#E9EEEA;color:#23252C"><span>23:03</span><span class="right"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="bat"></span></span></div>
  <div class="nb" style="background:#E9EEEA;border-bottom:3px solid rgba(35,37,44,.10)"><span class="t" style="color:#23252C">标注</span>
    <span class="capsule" style="background:rgba(35,37,44,.06);box-shadow:inset 0 0 0 2px rgba(35,37,44,.10);color:#23252C"><span class="dots"><i></i><i></i><i></i></span><span class="dv"></span><span class="cls"></span></span></div>
  <div class="docbody">
    <div class="blk2"><h4>这一稿改的：模板预览盖上完整弹窗，毛玻璃垫底</h4>
      <p><b>你的原话："在拉起笔记卡片模板时候，不要把后面的笔记展示出来，这会影响感观，例如用毛玻璃效果作为背景。笔记模板选择预览是在原笔记详情页渲染，看上去是完整的弹窗，然后，保存或者取消后，再消失，恢复到详情页状态。"</b></p>

      <p><b>怎么关：</b>取消、保存成功、点一下窗口顶上的把手，三个口都收掉弹窗、回到详情页状态。⑥屏就是保存成功后那一眼——弹窗没了，毛玻璃跟着撤，背景恢复清晰（这一屏与第六稿一字未动）。</p></div>
    <div class="blk2"><h4>这一轮只出中文</h4>
      <p>你说"为了加快速度，效果图你只需要生成中文版即可"——这轮就只有中文六屏。英文骨架字的出处与第五/六稿同一条（<code>utils/i18n.js</code> en 段逐键照抄、模板名吐司取 <code>poster.js</code> 的 labelEn），落地时照抄即可，不再重复出图。</p></div>
    <div class="blk2"><h4>尺寸增量（rpx，其余照第六稿尺寸表）</h4>
      <table>

        <tr><td>弹窗几何</td><td>与详情窗口同一条：左右 24、上沿 130（停在搜索上方）、下沿离底栏 24；窗内把手 + 海报预览 + 带二维码 + 取消/保存到相册，与第六稿一字未动</td></tr>
        <tr><td>其余</td><td>收起行 124 / 预览卡 362 / 动感横条 / 详情窗，全部照第六稿，一行没动</td></tr>
      </table></div>
    <div class="blk2"><h4>字符串</h4>
      <p><b>这一稿没有新串，也没撤串：</b>④⑤⑥屏的每一个字都与第六稿相同（取消 / 保存到相册 / 带二维码 / 左右滑换模板 / 模板名吐司 / 已保存到相册 / 点一下收起）。「左右滑换模板」「点一下收起」仍是那两枚待拍的新串。</p></div>
    <div class="blk2"><h4>还等你拍的（全部原样带着）</h4>
      <p><b>预览这条线上的：</b>① 默认概要开在哪条（画的是进页面开在第一条/置顶）；② 概要几行截断（画的是整四行）；③ 点开着卡的行 = 进详情窗口；④ 标题 36 字阶现网没有（<code>--fs-h2</code> 是 34），加一档还是用 34。</p>
