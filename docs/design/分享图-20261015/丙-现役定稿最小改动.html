<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
/* 分享封面 · 方向丙：现役定稿（杂志版甲·纸白）最小改动版——
   骨架一处不动（报头 + 3px 墨线 + 宋体大字两行 + Playfair 斜体副题 + 编号三条 + 右半手机壳套「杂志封面」+ 真码），
   只换三样：① 大字换成场景钩子；② 三条内文换成"竞品没有的三条"；③ 壳里那张的照片位换成 CSS 画的浅面
   （现役用的是官网那张真人照片，肖像权没确认过，这版撤掉）。 */
@font-face { font-family: 'Playfair'; src: url('playfair-display-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Playfair'; src: url('playfair-display-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
@font-face { font-family: 'Playfair'; src: url('playfair-display-latin-500-italic.woff2') format('woff2'); font-weight: 500; font-style: italic; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 1024px; overflow: hidden; }
.card { position: relative; width: 1280px; height: 1024px; background: #F2EFE9; color: #14161A;
  font-family: 'Songti SC', 'STSong', serif; }

.mast { position: absolute; left: 84px; top: 74px; right: 84px; display: flex; align-items: flex-end;
  justify-content: space-between; padding-bottom: 16px; border-bottom: 3px solid #14161A; }
.mast .mk { font-family: 'Playfair'; font-weight: 500; font-size: 21px; letter-spacing: .42em; }
.mast .mr { font-family: 'Playfair'; font-size: 21px; letter-spacing: .18em; color: rgba(20,22,26,.6); }

.h1 { position: absolute; left: 84px; top: 196px; width: 600px; font-size: 82px; line-height: 1.26;
  font-weight: 700; letter-spacing: -.01em; }
.h1 i { font-style: normal; color: #D2683F; }
.sub { position: absolute; left: 84px; top: 440px; font-size: 27px; line-height: 1.3; color: rgba(20,22,26,.52);
  letter-spacing: .04em; }
.sub b { font-weight: 400; color: rgba(20,22,26,.28); padding: 0 10px; }

.list { position: absolute; left: 84px; top: 512px; width: 580px; }
.it { display: flex; gap: 24px; padding: 20px 0; border-top: 1px solid rgba(20,22,26,.16); }
.it:last-child { border-bottom: 1px solid rgba(20,22,26,.16); }
.no { flex: none; font-family: 'Playfair'; font-weight: 500; font-size: 36px; line-height: 1.05; width: 52px; color: #6E9070; }
.it:nth-child(2) .no { color: #D2683F; } .it:nth-child(3) .no { color: #4B50C9; }
.tt { font-size: 30px; font-weight: 700; letter-spacing: .04em; }
.dd { margin-top: 6px; font-size: 22px; line-height: 1.45; color: rgba(20,22,26,.62); }
.foot { position: absolute; left: 84px; bottom: 46px; font-size: 22px; letter-spacing: .1em; color: rgba(20,22,26,.5); }

.phone { position: absolute; right: 96px; top: 118px; width: 452px; height: 828px; border-radius: 66px;
  background: #1B1D22; padding: 16px; box-shadow: 0 40px 80px rgba(20,22,26,.26), inset 0 0 0 2px rgba(255,255,255,.08); }
.scr { position: relative; width: 420px; height: 796px; border-radius: 52px; overflow: hidden; background: #fff; }
.isl { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); width: 118px; height: 32px;
  border-radius: 999px; background: #1B1D22; z-index: 5; }

.cover { position: absolute; inset: 0; background: #14161A; color: #F2EFE9; }
.cover .ph { position: relative; height: 430px; overflow: hidden;
  background: linear-gradient(180deg, #EDF0E7 0%, #D3DDCB 52%, #A9BBA4 100%); }
.cover .ph .sun { position: absolute; right: 66px; top: 96px; width: 104px; height: 104px; border-radius: 50%;
  background: rgba(210,168,120,.5); }
.cover .ph .sea { position: absolute; left: -20px; right: -20px; bottom: -8px; height: 150px;
  background: linear-gradient(180deg, rgba(110,144,112,.42), rgba(60,84,64,.62));
  border-radius: 50% 50% 0 0 / 24% 24% 0 0; }
.cover .ph .tg { position: absolute; left: 28px; top: 26px; font-family: 'Playfair'; font-size: 14px;
  letter-spacing: .3em; color: rgba(20,22,26,.5); }
.cover .kick { position: absolute; left: 28px; top: 452px; font-family: 'Playfair'; font-size: 15px;
  letter-spacing: .3em; color: rgba(242,239,233,.62); }
.cover .ct { position: absolute; left: 28px; right: 28px; top: 476px; font-size: 46px; line-height: 1.22; font-weight: 700; }
.cover .pt { position: absolute; left: 28px; right: 124px; top: 566px; font-size: 19px; line-height: 1.5;
  color: rgba(242,239,233,.8); }
.cover .pt div { padding: 8px 0; border-top: 1px solid rgba(242,239,233,.16); }
.cover .sign { position: absolute; left: 28px; bottom: 30px; display: flex; align-items: center; gap: 10px;
  font-size: 17px; color: rgba(242,239,233,.72); }
.cover .sign i { width: 34px; height: 34px; border-radius: 50%; background: #F6C445; display: inline-block; }
.cover .qr { position: absolute; right: 24px; bottom: 24px; width: 84px; height: 84px; border-radius: 10px; }
.cover .qr img { width: 84px; height: 84px; border-radius: 10px; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="mast">
    <div class="mk">TUMARK · 图麦笔记</div>
    <div class="mr">agentsbin.cn</div>
  </div>

  <div class="h1">看到好内容，<br><i>随手</i>记下来。</div>
  <div class="sub">10 套卡片<b>·</b>5 种心情<b>·</b>免费不限量</div>

  <div class="list">
    <div class="it"><div class="no">01</div><div><div class="tt">存的是内容本身</div>
      <div class="dd">原文被删了，你这条笔记还在</div></div></div>
    <div class="it"><div class="no">02</div><div><div class="tt">自动出摘要、要点、标签</div>
      <div class="dd">链接、截图丢进来就行</div></div></div>
    <div class="it"><div class="no">03</div><div><div class="tt">卡片自带一个码</div>
      <div class="dd">扫开就是这一条笔记，不是首页</div></div></div>
  </div>

  <div class="foot">微信搜「图麦笔记」</div>

  <div class="phone"><div class="scr"><div class="isl"></div>
    <div class="cover">
      <div class="ph"><div class="tg">TRAVEL</div><div class="sun"></div><div class="sea"></div></div>
      <div class="kick">旅行 · 10/15</div>
      <div class="ct">厦门三日路线</div>
      <div class="pt"><div>轮渡提前一天订，别现场排队</div><div>岛上骑车比走路省一半时间</div><div>傍晚五点后沙坡尾光线最好</div></div>
      <div class="sign"><i></i>阿麦 · 图麦笔记</div>
      <div class="qr"><img src="qr_sharecard.jpg" alt=""></div>
    </div>
  </div></div>
</div>
</body>
</html>
