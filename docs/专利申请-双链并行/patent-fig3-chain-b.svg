  <rect x="530" y="902" width="260" height="48" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="660" y="921.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">以最低档结果作为本份的输出</text>
  <text x="660" y="938.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">（不丢弃原件）</text>
