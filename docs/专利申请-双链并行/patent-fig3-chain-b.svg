  <text x="285" y="1074.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">客户端直传至云对象存储</text>
  <path d="M 285 1090 L 285 1120" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="285,1120 435,1160 285,1200 135,1160" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="285" y="1164.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">直传是否成功？</text>
  <path d="M 285 1200 L 285 1240" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="296" y="1210" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="305" y="1221" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">是</text>
  <path d="M 435 1160 L 530 1160" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="473" y="1144" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="482" y="1155" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">否</text>
  <rect x="530" y="1099" width="260" height="62" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="660" y="1117.28" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">输出空值且不向调用方抛出</text>
  <text x="660" y="1134.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">异常；调用方跳过该份并继续</text>
  <text x="660" y="1151.36" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">处理下一份</text>
  <path d="M 660 1161 L 660 1352 L 435 1352" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="523" y="1336" width="54" height="17" fill="#fff" stroke="none"/>
  <text x="550" y="1347" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">跳过该份</text>
  <rect x="120" y="1240" width="330" height="40" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="285" y="1264.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">记录该份的存储标识</text>
  <path d="M 285 1280 L 285 1311" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="285,1311 435,1352 285,1393 135,1352" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="285" y="1347.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">本批是否还有</text>
  <text x="285" y="1364.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">未处理的图像？</text>
  <path d="M 135 1352 L 100 1352 L 100 52 L 120 52" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="91" y="692" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="100" y="703" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">是</text>
  <path d="M 285 1393 L 285 1430" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="296" y="1402" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="305" y="1413" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">否</text>
  <rect x="120" y="1430" width="330" height="40" rx="20" ry="20" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="285" y="1454.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">输出本批的存储标识集合</text>
