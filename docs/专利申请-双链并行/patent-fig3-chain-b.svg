  <path d="M 790 926 L 848 926" fill="none" stroke="#000" stroke-width="1.6"/>
  <path d="M 848 350 L 848 1000" fill="none" stroke="#000" stroke-width="1.6"/>
  <path d="M 848 1000 L 450 1000" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="120" y="980" width="330" height="40" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="285" y="1004.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">确定本份的输出</text>
  <path d="M 285 1020 L 285 1050" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
