  <text x="285" y="573.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">以该档质量参数导出为</text>
  <text x="285" y="590.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">有损编码文件</text>
  <path d="M 285 601 L 285 636" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="285,636 445,678 285,720 125,678" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="285" y="673.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">能否读取导出文件</text>
  <text x="285" y="690.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">的字节数？</text>
  <path d="M 285 720 L 285 756" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="296" y="728" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="305" y="739" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">能</text>
  <path d="M 445 678 L 530 678" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="472" y="662" width="30" height="17" fill="#fff" stroke="none"/>
  <text x="487" y="673" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">不能</text>
  <rect x="530" y="652" width="260" height="52" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="660" y="673.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">不拦截：仍将该档导出结果</text>
  <text x="660" y="690.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">作为本份的输出</text>
  <polygon points="285,756 445,798 285,840 125,798" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="285" y="793.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">字节数是否不超过</text>
  <text x="285" y="810.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">预设预算阈值？</text>
  <path d="M 285 840 L 285 980" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="264" y="897" width="42" height="17" fill="#fff" stroke="none"/>
  <text x="285" y="908" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">不超过</text>
  <path d="M 445 798 L 530 798" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="472" y="782" width="30" height="17" fill="#fff" stroke="none"/>
  <text x="487" y="793" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">超过</text>
  <polygon points="660,756 790,798 660,840 530,798" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="660" y="793.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">阶梯档位</text>
  <text x="660" y="810.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">是否已用尽？</text>
  <path d="M 660 840 L 660 902" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="639" y="864" width="42" height="17" fill="#fff" stroke="none"/>
