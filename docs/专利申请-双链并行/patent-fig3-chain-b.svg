  <text x="305" y="440" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">可</text>
  <path d="M 445 368 L 530 368" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
