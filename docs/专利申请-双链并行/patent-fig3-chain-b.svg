<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1496" viewBox="0 0 880 1496">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="1496" fill="#fff" stroke="none"/>
  <rect x="120" y="32" width="330" height="40" rx="20" ry="20" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="285" y="56.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">以串行方式取本批下一份图像</text>
  <path d="M 285 72 L 285 106" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="285,106 445,148 285,190 125,148" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="285" y="143.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">能否读取该份图像的</text>
  <text x="285" y="160.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">原始尺寸信息？</text>
  <path d="M 285 190 L 285 244" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="296" y="207" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="305" y="218" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">能</text>
  <path d="M 445 148 L 660 148 L 660 319" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="505" y="132" width="30" height="17" fill="#fff" stroke="none"/>
  <text x="520" y="143" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">不能</text>
  <rect x="530" y="319" width="260" height="62" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="660" y="337.28" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">以未经压缩的原始图像数据</text>
  <text x="660" y="354.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">作为本份的输出</text>
  <text x="660" y="371.36" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">（宁可增大体积也不得丢弃原件）</text>
  <rect x="120" y="244" width="330" height="48" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="285" y="263.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">按长边阈值计算缩放比例，在离屏</text>
  <text x="285" y="280.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">绘图表面上重绘</text>
  <path d="M 285 292 L 285 326" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="285,326 445,368 285,410 125,368" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="285" y="363.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">重绘与逐档导出</text>
  <text x="285" y="380.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">是否可完成？</text>
  <path d="M 285 410 L 285 468" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
