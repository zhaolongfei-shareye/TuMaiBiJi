  <rect x="120" y="468" width="330" height="40" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="285" y="492.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">取质量阶梯中的下一档</text>
  <path d="M 285 508 L 285 555" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
