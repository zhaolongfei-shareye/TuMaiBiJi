<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1305" viewBox="0 0 880 1305">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="1305" fill="#fff" stroke="none"/>
  <rect x="280" y="26" width="320" height="40" rx="20" ry="20" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="440" y="51.04" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="14" fill="#000">用户在客户端提交多源内容</text>
  <path d="M 440 66 L 440 96" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="200" y="101" width="480" height="62" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="440" y="127.45" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">识别本次提交的两类处理对象：可由原件重算的语义派生数据</text>
  <text x="440" y="145.91" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">／一经丢失即不可恢复的原件数据</text>
  <path d="M 330 163 L 250 220" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M 550 163 L 640 220" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="85" y="224" width="330" height="48" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="250" y="243.45" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">语义抽取链（A 链）</text>
  <text x="250" y="261.91" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">发起首个网络请求</text>
  <rect x="475" y="224" width="330" height="48" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="640" y="243.45" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">建立原件留存链（B 链）的异步</text>
  <text x="640" y="261.91" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">任务句柄，且不对其执行等待</text>
  <path d="M 475 248 L 415 248" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="412" y="227" width="66" height="17" fill="#fff" stroke="none"/>
  <text x="445" y="238" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">先建立句柄</text>
  <path d="M 48 288 L 48 1030" fill="none" stroke="#000" stroke-width="1.1" stroke-dasharray="6 4"/>
  <path d="M 852 288 L 852 1030" fill="none" stroke="#000" stroke-width="1.1" stroke-dasharray="6 4"/>
  <rect x="85" y="314" width="330" height="60" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="250" y="331.28" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">两阶段传输：暂存阶段逐份写入</text>
  <text x="250" y="348.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">服务端易失性暂存区（多级准入</text>
  <text x="250" y="365.36" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">治理，详见图 5），返回批次标识</text>
  <path d="M 250 374 L 250 402" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="85" y="417" width="330" height="46" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="250" y="435.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">处理阶段凭批次标识投递异步</text>
  <text x="250" y="452.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">任务队列，返回任务标识</text>
  <path d="M 250 463 L 250 495" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="85" y="501" width="330" height="66" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="250" y="521.28" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">工作进程：像素量前置准入 →</text>
  <text x="250" y="538.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">光学字符识别（互斥锁串行）→</text>
  <text x="250" y="555.36" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">语言模型推理（详见图 2）</text>
  <path d="M 250 567 L 250 595" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="85" y="599" width="330" height="82" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="250" y="618.76" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">推理可用时产出结构化知识数据；</text>
  <text x="250" y="635.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">不可用时降级写入——以原始文本首</text>
  <text x="250" y="652.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">个非空行的定长前缀充当标题，余</text>
  <text x="250" y="669.88" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">字段置空并附降级标记</text>
  <path d="M 250 681 L 250 709" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="85" y="725" width="330" height="46" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="250" y="743.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">持久化并返回记录标识</text>
  <text x="250" y="760.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">（两种情形下记录均被持久化）</text>
  <rect x="475" y="324" width="330" height="40" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="640" y="348.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">以串行方式取本批下一份图像</text>
  <path d="M 640 364 L 640 394" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="475" y="401" width="330" height="66" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="640" y="412.76" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">按质量阶梯逐档导出至体积达标</text>
  <text x="640" y="429.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">或档位用尽；压缩不可完成时输出</text>
  <text x="640" y="446.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">未经压缩的原始图像数据</text>
  <text x="640" y="463.88" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">（两级退路，详见图 3）</text>
  <path d="M 640 467 L 640 495" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="475" y="510" width="330" height="60" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="640" y="527.28" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">客户端直传至云对象存储；直传</text>
  <text x="640" y="544.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">失败时输出空值而不抛出异常，</text>
  <text x="640" y="561.36" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">调用方跳过该份并继续下一份</text>
  <path d="M 640 570 L 640 598" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="475" y="616" width="330" height="40" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="640" y="640.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">收集该份的存储标识</text>
  <path d="M 640 656 L 640 686" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="640,683 790,722 640,761 490,722" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="640" y="717.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">本批是否还有</text>
  <text x="640" y="734.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">未处理的图像？</text>
  <path d="M 490 722 L 445 722 L 445 344 L 475 344" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="473.5" y="521" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="482.5" y="532" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">是</text>
  <text x="440" y="1000" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">两链执行区间在时间上重叠</text>
  <path d="M 250 771 L 250 1026" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M 640 761 L 640 1026" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="651" y="881.5" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="660" y="892.5" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">否</text>
  <rect x="280" y="1026" width="320" height="40" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="440" y="1050.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">两链均已终止</text>
  <path d="M 440 1066 L 440 1098" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="440,1108 615,1148 440,1188 265,1148" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="440" y="1152.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">A 链是否产出了记录标识？</text>
  <rect x="60" y="1233" width="300" height="46" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="210" y="1260.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">引用绑定（详见图 4）</text>
  <path d="M 265 1148 L 210 1148 L 210 1233" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="228.5" y="1178.5" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="237.5" y="1189.5" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">是</text>
  <rect x="515" y="1233" width="310" height="46" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="670" y="1260.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">跨链补偿回滚（详见图 4）</text>
  <path d="M 615 1148 L 670 1148 L 670 1233" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="633.5" y="1178.5" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="642.5" y="1189.5" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">否</text>
</svg>
