<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1496" viewBox="0 0 880 1496">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="1496" fill="#fff" stroke="none"/>
  <rect x="290" y="28" width="340" height="40" rx="20" ry="20" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="460" y="52.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">两链均已终止</text>
  <path d="M 460 68 L 460 106" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="460,106 650,148 460,190 270,148" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="460" y="152.68" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="13" fill="#000">A 链是否产出了记录标识？</text>
  <path d="M 270 148 L 215 148 L 215 207" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="232" y="132" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="241" y="143" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">是</text>
  <path d="M 650 148 L 705 148 L 705 218" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="665" y="132" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="674" y="143" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">否</text>
  <rect x="65" y="207" width="300" height="46" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="215" y="225.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">调用引用绑定接口，提交</text>
  <text x="215" y="242.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">存储标识集合与记录标识</text>
  <path d="M 215 253 L 215 283" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="65" y="283" width="300" height="46" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="215" y="301.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">对本次提交的存储标识去重，</text>
  <text x="215" y="318.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">并求其与该记录既有关联之并集</text>
  <path d="M 215 329 L 215 359" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="215,359 365,401 215,443 65,401" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="215" y="396.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">并集数目是否超过</text>
  <text x="215" y="413.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">预设张数上限？</text>
  <path d="M 215 443 L 215 473" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="226" y="450" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="235" y="461" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">否</text>
  <rect x="65" y="473" width="300" height="46" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="215" y="491.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">取下一条存储标识，以其为键</text>
  <text x="215" y="508.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">查询既有资产行</text>
  <path d="M 215 519 L 215 549" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="215,549 365,591 215,633 65,591" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="215" y="586.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">既有行是否归属其他账户，</text>
  <text x="215" y="603.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">或已关联至其他记录？</text>
  <path d="M 215 633 L 215 657" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="226" y="637" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="235" y="648" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">否</text>
  <rect x="65" y="657" width="300" height="58" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="215" y="673.28" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">不存在既有行则新建；存在则</text>
  <text x="215" y="690.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">更新其关联关系、账户标识与</text>
  <text x="215" y="707.36" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">尺寸、字节数</text>
  <path d="M 215 715 L 215 745" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="215,745 365,787 215,829 65,787" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="215" y="782.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">本批是否还有未处置的</text>
  <text x="215" y="799.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">存储标识？</text>
  <path d="M 65 787 L 35 787 L 35 496 L 65 496" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="19" y="632" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="28" y="643" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">是</text>
  <path d="M 215 829 L 215 862" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="226" y="832" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="235" y="843" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">否</text>
  <rect x="65" y="862" width="300" height="40" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="215" y="886.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">提交事务，返回已绑定的资产行</text>
  <path d="M 215 902 L 215 932" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M 365 401 L 374 401" fill="none" stroke="#000" stroke-width="1.6"/>
  <path d="M 365 591 L 374 591" fill="none" stroke="#000" stroke-width="1.6"/>
  <path d="M 374 401 L 374 591" fill="none" stroke="#000" stroke-width="1.6"/>
  <path d="M 374 496 L 400 496" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="382" y="488" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">是</text>
  <rect x="400" y="473" width="150" height="46" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="475" y="491.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">整批拒绝：本次请求内已</text>
  <text x="475" y="508.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">作出的处置一并不予提交</text>
  <polygon points="215,932 355,972 215,1012 75,972" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="215" y="967.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">客户端是否收到</text>
  <text x="215" y="984.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">成功响应？</text>
  <path d="M 215 1012 L 215 1052" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="226" y="1022" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="235" y="1033" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">是</text>
  <rect x="75" y="1052" width="280" height="40" rx="20" ry="20" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="215" y="1076.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">引用完整，流程结束</text>
  <path d="M 75 972 L 45 972 L 45 1150 L 65 1150" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="43" y="1042" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="52" y="1053" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">否</text>
  <rect x="65" y="1119" width="300" height="62" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="215" y="1137.28" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">写入客户端非易失性补偿队列：</text>
  <text x="215" y="1154.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">同一记录标识合并为一条，总数</text>
  <text x="215" y="1171.36" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">超上限则淘汰最早写入的条目</text>
  <path d="M 215 1181 L 215 1211" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="65" y="1211" width="300" height="46" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="215" y="1229.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">客户端由后台转入前台的生命</text>
  <text x="215" y="1246.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">周期事件触发重放</text>
  <path d="M 215 1257 L 215 1287" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="215,1287 365,1329 215,1371 65,1329" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="215" y="1324.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">服务端响应的状态码</text>
  <text x="215" y="1341.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">属于哪一类？</text>
  <path d="M 215 1371 L 215 1400" fill="none" stroke="#000" stroke-width="1.6"/>
  <path d="M 140 1400 L 310 1400" fill="none" stroke="#000" stroke-width="1.6"/>
  <path d="M 140 1400 L 140 1418" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M 310 1400 L 310 1418" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="140" y="1394" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">请求不成立类</text>
  <text x="310" y="1394" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">临时不可用类／无响应</text>
  <rect x="65" y="1418" width="150" height="52" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="140" y="1439.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">移除该条目</text>
  <text x="140" y="1456.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">不再重放</text>
  <rect x="225" y="1418" width="170" height="52" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="310" y="1439.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">保留该条目</text>
  <text x="310" y="1456.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">等待后续重放</text>
  <path d="M 395 1444 L 430 1444 L 430 1234 L 365 1234" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="565" y="218" width="280" height="56" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="705" y="241.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">取 B 链已成功提交的全部存储</text>
  <text x="705" y="258.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">标识（即无索引指向的孤儿对象）</text>
  <path d="M 705 274 L 705 330" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="565" y="330" width="280" height="40" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="705" y="354.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">调用云对象存储删除接口</text>
  <path d="M 705 370 L 705 402" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="705,402 845,444 705,486 565,444" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="705" y="439.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">删除是否成功，且客户端</text>
  <text x="705" y="456.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">是否具备云存储能力？</text>
  <path d="M 705 486 L 705 540" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="716" y="502" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="725" y="513" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">是</text>
  <rect x="565" y="540" width="280" height="40" rx="20" ry="20" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="705" y="564.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">无孤儿对象，流程结束</text>
  <path d="M 845 444 L 862 444 L 862 620 L 845 620" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="857" y="512" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="866" y="523" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">否</text>
  <rect x="565" y="597" width="280" height="46" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="705" y="624.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">将待删存储标识写入待删队列</text>
  <path d="M 705 643 L 705 691" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="565" y="691" width="280" height="50" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="705" y="711.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">与补偿队列共用同一生命周期</text>
  <text x="705" y="728.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">事件重放删除</text>
  <path d="M 705 741 L 705 772" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="705,772 845,812 705,852 565,812" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="705" y="816.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12.0" fill="#000">删除是否成功？</text>
  <path d="M 705 852 L 705 900" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="716" y="868" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="725" y="879" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">是</text>
  <rect x="565" y="900" width="280" height="40" rx="20" ry="20" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="705" y="924.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">存储侧最终一致</text>
  <path d="M 845 812 L 862 812 L 862 716 L 845 716" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="857" y="756" width="18" height="17" fill="#fff" stroke="none"/>
  <text x="866" y="767" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">否</text>
</svg>
