  <rect x="540" y="526" width="300" height="44" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="690" y="552.32" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">拒绝</text>
