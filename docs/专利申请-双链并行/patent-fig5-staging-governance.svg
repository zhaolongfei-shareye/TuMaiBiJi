  <text x="270" y="1161.8" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">处理阶段：整批投递至异步任务队列</text>
  <text x="270" y="1178.84" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="12" fill="#000">后当即自暂存区移除以释放内存</text>
